<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportMatch — Leadership Tracker</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo-mark.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100vh; width: 100vw; overflow: hidden; display: flex; background: #0f172a; }

  #frame-wrapper { flex: 1; position: relative; overflow: hidden; }
  #main-frame { width: 100%; height: 100%; border: none; display: block; background: #f8fafc; }

  #sidebar {
    width: 180px;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    transition: width 0.25s cubic-bezier(.4,0,.2,1);
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  #sidebar.collapsed { width: 48px; }

  /* Header */
  .sb-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }
  .sb-logo {
    width: 26px; height: 26px;
    border-radius: 7px;
    flex-shrink: 0;
    display: block;
  }
  .sb-title {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 12.5px; font-weight: 700;
    color: #e2e8f0;
    white-space: nowrap;
    transition: opacity 0.2s, transform 0.2s;
    line-height: 1.2;
  }
  .sb-sub {
    font-size: 10px; font-weight: 400; color: #64748b;
    display: block; margin-top: 1px;
  }
  #sidebar.collapsed .sb-title { opacity: 0; transform: translateX(6px); pointer-events: none; }

  /* Nav */
  .sb-nav {
    flex: 1;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 8px;
    border: none; background: transparent;
    color: #64748b;
    border-radius: 8px; cursor: pointer;
    transition: background 0.14s, color 0.14s;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px; font-weight: 500;
    text-align: left; white-space: nowrap;
    position: relative;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.06); color: #cbd5e1; }
  .nav-btn.active { background: rgba(61,173,255,0.14); color: #3DADFF; }
  .nav-btn.active .nav-icon { opacity: 1; }

  .nav-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.6; transition: opacity 0.14s; }
  .nav-btn:hover .nav-icon, .nav-btn.active .nav-icon { opacity: 1; }

  .nav-label { transition: opacity 0.2s, transform 0.2s; }
  #sidebar.collapsed .nav-label { opacity: 0; transform: translateX(6px); pointer-events: none; }

  /* Tooltip on collapsed */
  #sidebar.collapsed .nav-btn::after {
    content: attr(data-label);
    position: absolute;
    left: calc(100% + 10px);
    top: 50%; transform: translateY(-50%);
    background: #1e293b;
    color: #e2e8f0;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #sidebar.collapsed .nav-btn:hover::after { opacity: 1; }

  /* Divider */
  .sb-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 4px 8px; }

  /* Footer / toggle */
  .sb-footer {
    padding: 8px 6px;
    border-top: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #toggle-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 34px;
    border: none; border-radius: 7px;
    background: rgba(255,255,255,0.04);
    color: #475569; cursor: pointer;
    transition: background 0.14s, color 0.14s;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  #toggle-btn:hover { background: rgba(255,255,255,0.09); color: #94a3b8; }
  .toggle-chevron { flex-shrink: 0; transition: transform 0.25s cubic-bezier(.4,0,.2,1); }
  .toggle-label { transition: opacity 0.2s; }
  #sidebar.collapsed .toggle-chevron { transform: rotate(180deg); }
  #sidebar.collapsed .toggle-label { opacity: 0; width: 0; overflow: hidden; }

  .branch-link {
    text-decoration: none;
  }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-header">
    <img class="sb-logo" src="/assets/brand/logo-mark.svg" alt="SportMatch" width="26" height="26">
    <span class="sb-title">
      SportMatch
      <span class="sb-sub">Leaders View</span>
    </span>
  </div>

  <nav class="sb-nav">
    <button class="nav-btn active" data-src="leadership/pert.html" data-label="PERT">
      <!-- network/dag icon -->
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="7.5" width="4.5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="7.75" y="2" width="4.5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="7.75" y="13" width="4.5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="14.5" y="7.5" width="4.5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
        <line x1="5.5" y1="9" x2="7.75" y2="4.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="5.5" y1="11" x2="7.75" y2="15.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="12.25" y1="4.5" x2="14.5" y2="9" stroke="currentColor" stroke-width="1.4"/>
        <line x1="12.25" y1="15.5" x2="14.5" y2="11" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <span class="nav-label">PERT / CPM · v1</span>
    </button>

    <button class="nav-btn" data-src="leadership/gantt.html" data-label="Gantt">
      <!-- bar chart icon -->
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="3.5" width="8" height="3" rx="1.2" fill="currentColor"/>
        <rect x="5" y="8.5" width="10" height="3" rx="1.2" fill="currentColor"/>
        <rect x="3" y="13.5" width="6" height="3" rx="1.2" fill="currentColor"/>
        <line x1="2" y1="2" x2="2" y2="18" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">Gantt Devs · v1</span>
    </button>

    <div class="nav-sep" style="height:1px;background:currentColor;opacity:.14;margin:10px 12px;"></div>

    <button class="nav-btn" data-src="leadership/pert-v2.html" data-label="PERT v2">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="7.5" width="4.5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="7.75" y="2" width="4.5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="7.75" y="13" width="4.5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="14.5" y="7.5" width="4.5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
        <line x1="5.5" y1="9" x2="7.75" y2="4.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="5.5" y1="11" x2="7.75" y2="15.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="12.25" y1="4.5" x2="14.5" y2="9" stroke="currentColor" stroke-width="1.4"/>
        <line x1="12.25" y1="15.5" x2="14.5" y2="11" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <span class="nav-label">PERT / CPM · v2</span>
    </button>

    <button class="nav-btn" data-src="leadership/gantt-v2.html" data-label="Gantt v2">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="3.5" width="8" height="3" rx="1.2" fill="currentColor"/>
        <rect x="5" y="8.5" width="10" height="3" rx="1.2" fill="currentColor"/>
        <rect x="3" y="13.5" width="6" height="3" rx="1.2" fill="currentColor"/>
        <line x1="2" y1="2" x2="2" y2="18" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">Gantt Devs · v2</span>
    </button>
  </nav>

  <div class="sb-footer">
    <a class="nav-btn branch-link" href="/tools" data-label="Dev Branch">
      <!-- toolbox icon -->
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2.5" y="6.5" width="15" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7.25 6.5V4.6c0-.9.7-1.6 1.6-1.6h2.3c.9 0 1.6.7 1.6 1.6v1.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M2.8 10.2h14.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8.2 10.2v1.3c0 .4.3.7.7.7h2.2c.4 0 .7-.3.7-.7v-1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">Dev Branch</span>
    </a>
    <button id="toggle-btn">
      <!-- chevron right -->
      <svg class="toggle-chevron" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M9 3L5 7L9 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="toggle-label">Colapsar</span>
    </button>
  </div>
</div>

<div id="frame-wrapper">
  <iframe id="main-frame" src="leadership/pert.html" title="Vista actual"></iframe>
</div>

<script>
  const sidebar = document.getElementById('sidebar');
  const frame   = document.getElementById('main-frame');
  const toggleLabel = sidebar.querySelector('.toggle-label');

  document.getElementById('toggle-btn').addEventListener('click', () => {
    const collapsed = sidebar.classList.toggle('collapsed');
    toggleLabel.textContent = collapsed ? 'Expandir' : 'Colapsar';
  });

  document.querySelectorAll('button.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      frame.src = btn.dataset.src;
    });
  });
</script>

</body>
</html>
