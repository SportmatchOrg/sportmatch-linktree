<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportMatch — Steering</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo-mark.svg">
<style>
  :root{
    --navy:#101c53;
    --ink:#0f172a;
    --muted:#64748b;
    --bg:#f8fafc;
    --panel:#ffffff;
    --border:#e2e8f0;
    --soft:#f1f5f9;
    --blue:#2a78d6;
    --orange:#eb6834;
    --good:#15803d;
    --good-bg:#f0fdf4;
    --good-border:#bbf7d0;
    --bad:#b91c1c;
    --amber-bg:#fffbeb;
    --amber-border:#fde68a;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:24px 24px 64px;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  .wrap{ max-width:980px; margin:0 auto; }

  .title{
    background:var(--navy); color:#fff;
    border-radius:10px; padding:16px;
    text-align:center; font-size:22px; font-weight:800; letter-spacing:-0.01em;
  }
  .title{ display:flex; align-items:center; justify-content:center; gap:12px; }
  .title select{
    font:inherit; font-size:13px; font-weight:700; color:var(--navy); cursor:pointer;
    background:#fff; border:0; border-radius:8px; padding:4px 8px;
  }

  .bar{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; align-items:center; }
  .bar a{
    text-decoration:none; font-size:13px; font-weight:700; color:var(--navy);
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:7px 12px;
  }
  .bar a:hover{ border-color:#94a3b8; }

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:20px 22px; margin-top:16px;
  }
  .card > h2{ margin:0 0 4px; font-size:17px; font-weight:800; letter-spacing:-0.01em; }
  .card > .lead{ margin:0 0 14px; color:var(--muted); font-size:13px; }
  h3{ margin:22px 0 8px; font-size:13.5px; font-weight:800; color:var(--navy); text-transform:uppercase; letter-spacing:.04em; }
  p{ margin:0 0 10px; font-size:13.5px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; margin:0 0 12px; }
  th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; }
  td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.total td{ font-weight:800; border-top:2px solid var(--ink); }
  tr.cut td{ background:#fdf2ec; font-weight:700; }
  td.ids{ font-size:12px; color:var(--muted); }
  .table-scroll{ overflow-x:auto; }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:4px 0 14px; }
  .kpi{ border:1px solid var(--border); border-radius:8px; padding:10px 12px; background:var(--panel); }
  .kpi .k{ font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .kpi .v{ font-size:24px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; margin-top:2px; }
  .kpi .s{ font-size:12px; color:var(--muted); }
  .kpi.hl{ border-color:var(--blue); box-shadow:inset 0 2px 0 var(--blue); }
  .up{ color:var(--good); font-weight:700; }
  .down{ color:var(--bad); font-weight:700; }

  .formula{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  .formula span{ font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--soft); border:1px solid var(--border); border-radius:6px; padding:3px 8px; }
  .note{
    background:var(--amber-bg); border:1px solid var(--amber-border); border-radius:8px;
    padding:11px 14px; font-size:13px; color:#78350f; margin:0 0 12px;
  }

  .chart-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin:22px 0 8px; }
  .chart-head h3{ margin:0; }
  .export{ display:flex; justify-content:flex-end; margin:0 0 6px; }
  .btn{
    font:inherit; font-size:12.5px; font-weight:700; color:var(--navy); cursor:pointer;
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:5px 10px;
  }
  .btn:hover{ border-color:#94a3b8; }
  .chart-box{ position:relative; }
  .chart-box svg{ display:block; width:100%; height:auto; }
  .tip{
    position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; font-size:12px; box-shadow:0 4px 14px rgba(15,23,42,.12);
    opacity:0; transition:opacity .1s; min-width:170px;
  }
  .tip b{ display:block; margin-bottom:4px; }
  .tip .row{ display:flex; justify-content:space-between; gap:12px; font-variant-numeric:tabular-nums; }

  @media (max-width:760px){ body{ padding:16px 16px 48px; } }
  ul{ margin:0 0 12px; padding-left:20px; font-size:13.5px; }
  li{ margin-bottom:6px; }
  /* Actividades clave: cada fila se abre y muestra de dónde sale el avance. */
  #act-table tr.act{ cursor:pointer; }
  #act-table tr.act:hover > td, #act-table tr.act:focus-visible > td{ background:var(--soft); }
  #act-table tr.act > td:first-child::before{ content:"▸"; display:inline-block; width:14px; color:var(--muted); transition:transform .12s; }
  #act-table tr.act.open > td:first-child::before{ transform:rotate(90deg); }
  #act-table tr.det > td{ background:var(--soft); padding:12px 14px 14px; }
  .det-formula{ margin:0 0 10px; font-size:13px; }
  .det-table{ background:var(--panel); border:1px solid var(--border); border-radius:8px; margin:0 0 8px; }
  .det-table tr.iss td{ border-bottom-color:var(--soft); padding-top:4px; padding-bottom:4px; }
  .det-table .key{ font-weight:600; color:var(--blue); text-decoration:none; margin-right:6px; font-variant-numeric:tabular-nums; }
  .pill{ font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px; background:#f1f5f9; color:#475569; white-space:nowrap; }
  .pill.completed{ background:#dcfce7; color:#15803d; }
  .pill.started{ background:#fef3c7; color:#b45309; }
  .det-note{ margin:0; font-size:12px; color:var(--muted); }
  .weeks{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .weeks .btn[aria-pressed="true"]{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .foot{ margin-top:18px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="wrap">

<div class="title">
  <span id="t-name">Steering</span>
  <select id="ver-select" aria-label="Versión del steering"></select>
</div>

<nav class="bar">
  <a href="#avance">Avance</a>
  <a href="#actividades">Actividades clave</a>
  <a href="#presupuesto">Presupuesto</a>
  <a href="#valor-ganado">Valor ganado</a>
  <a href="#hitos">Hitos</a>
  <a href="#riesgos">Riesgos</a>
</nav>

<div class="card" id="avance">
  <h2>Avance del desarrollo</h2>
  <p class="lead" id="avance-lead"></p>
  <div class="kpis" id="avance-kpis"></div>
  <div class="export"><button class="btn" type="button" data-export="avance-table" data-name="avance">Descargar SVG</button></div>
  <div class="table-scroll"><table id="avance-table"></table></div>
</div>

<div class="card" id="actividades">
  <div class="chart-head" style="margin:0 0 4px">
    <h2 style="margin:0">Actividades clave</h2>
    <select class="btn" id="act-select" aria-label="Semana del tablero"></select>
  </div>
  <p class="lead" id="act-lead"></p>
  <div class="export"><button class="btn" type="button" data-export="act-table" data-name="actividades-clave">Descargar SVG</button></div>
  <div class="table-scroll"><table id="act-table"></table></div>
</div>

<div class="card" id="presupuesto">
  <h2>Presupuesto</h2>
  <p class="lead" id="pres-lead"></p>
  <div class="export"><button class="btn" type="button" data-export="pres-table" data-name="presupuesto">Descargar SVG</button></div>
  <div class="table-scroll"><table id="pres-table"></table></div>
  <div class="kpis" id="pres-kpis"></div>
  <p class="note" id="pres-note"></p>
  <h3>Qué recalcar</h3>
  <ul id="pres-recalcar"></ul>
</div>

<div class="card" id="valor-ganado">
  <h2>Valor ganado</h2>
  <p class="lead" id="evm-lead"></p>
  <div class="kpis" id="evm-kpis-1"></div>
  <div class="kpis" id="evm-kpis-2"></div>
  <div class="formula" id="evm-formula"></div>
  <p class="note" id="evm-note"></p>

  <div class="chart-head">
    <h3>Curva S · USD acumulados</h3>
    <button class="btn" id="svg-dl" type="button">Descargar SVG</button>
  </div>
  <div class="chart-box" id="chart-box"><div class="tip" id="tip"></div></div>

  <h3>Semana a semana</h3>
  <div class="weeks" id="wk-pick" role="group" aria-label="Semana"></div>
  <div class="kpis" id="wk-kpis"></div>
  <p class="note" id="wk-read"></p>

  <div class="export"><button class="btn" type="button" data-export="evm-table" data-name="valor-ganado-semanal">Descargar SVG</button></div>
  <div class="table-scroll" style="margin-top:12px"><table id="evm-table"></table></div>

  <h3>Qué recalcar</h3>
  <ul id="evm-recalcar"></ul>
</div>

<div class="card" id="hitos">
  <h2>Hitos del Charter</h2>
  <div class="export"><button class="btn" type="button" data-export="hitos-table" data-name="hitos">Descargar SVG</button></div>
  <div class="table-scroll"><table id="hitos-table"></table></div>
</div>

<div class="card" id="riesgos">
  <h2>Riesgos del plan restante</h2>
  <div class="export"><button class="btn" type="button" data-export="riesgos-table" data-name="riesgos">Descargar SVG</button></div>
  <div class="table-scroll"><table id="riesgos-table"></table></div>
</div>

<p class="foot" id="foot"></p>

</div>

/* ---- Cálculo ----------------------------------------------------------- */
const sum = (a) => a.reduce((s, x) => s + x, 0);
const cumulative = (a) => { let s = 0; return a.map((x) => (s += x)); };

function compute(d) {
  const n = d.weeks.length, c = d.cut;
  const other = (w) => sum(d.other.map((o) => o.byWeek[w + 1] || 0));
  const devRole = d.roles.find((r) => r.evm && !r.loe);
  const devWeek = devRole.people * devRole.hWeek;
  // Nivel de esfuerzo (loe): entra en PV y AC, y su EV es igual a su PV.
  const loe = d.roles.filter((r) => r.evm && r.loe);
  const loeWeekH = sum(loe.map((r) => r.people * r.hWeek)), loeWeek = sum(loe.map((r) => r.people * r.hWeek * r.rate));
  const loeRate = loeWeekH ? loeWeek / loeWeekH : 0;
  const devPv = cumulative(Array.from({ length: n }, (_, w) => devWeek * devRole.rate + other(w)));
  const pv = devPv.map((v, w) => v + loeWeek * (w + 1));
  const bac = pv[n - 1], bacDev = devPv[n - 1];
  const evH = cumulative(d.earned.map((e) => e.h));
  const ev = evH.map((h, w) => (h / d.devEffort) * bacDev + loeWeek * (w + 1));   // % completo × BAC desarrollo + PV loe
  const loeAct = d.loeActualHours || [];
  const ac = cumulative(d.actualHours.map((h, w) => h * devRole.rate + other(w) + (loeAct[w] || 0) * loeRate));
  const PV = pv[c - 1], EV = ev[c - 1], AC = ac[c - 1];
  const spi = EV / PV, cpi = EV / AC, eac = bac / cpi;
  const labor = d.roles.map((r) => ({ ...r, hh: r.people * r.hWeek * n, cost: r.people * r.hWeek * n * r.rate }));
  const otherTotal = sum(d.other.map((o) => sum(Object.values(o.byWeek))));
  const subtotal = sum(labor.map((r) => r.cost)) + otherTotal;
  return {
    n, c, pv, ev, ac, evH, bac, bacDev, PV, EV, AC, spi, cpi, eac,
    etc: eac - AC, vac: bac - eac, tcpi: (bac - EV) / (bac - AC),
    devWeek, loeWeek, loeWeekH, spiDev: (EV - loeWeek * c) / devPv[c - 1], labor, otherTotal, subtotal, contingency: subtotal * d.contingency,
    total: subtotal * (1 + d.contingency), hh: sum(labor.map((r) => r.hh)),
  };
}

/* ---- Formato ----------------------------------------------------------- */
const usd = (v, dec = 0) => "$" + v.toLocaleString("es-AR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
const num = (v, dec = 2) => v.toLocaleString("es-AR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
const pct = (v) => num(v * 100, 1) + " %";
const signed = (v) => (v >= 0 ? "+" : "−") + usd(Math.abs(v));
const $ = (id) => document.getElementById(id);
const kpi = (k, v, s = "", hl = false) => `<div class="kpi${hl ? " hl" : ""}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
const trend = (x, good, bad) => x >= 1 ? `<span class="up">▲ ${good}</span>` : `<span class="down">▼ ${bad}</span>`;
const row = (cells, cls = "") => `<tr${cls ? ` class="${cls}"` : ""}>${cells.join("")}</tr>`;
const td = (v, cls = "") => `<td${cls ? ` class="${cls}"` : ""}>${v}</td>`;
const head = (cols) => `<thead><tr>${cols.map(([t, cls]) => `<th${cls ? ` class="${cls}"` : ""}>${t}</th>`).join("")}</tr></thead>`;

/* ---- Curva S ----------------------------------------------------------- */
// Devuelve el SVG como texto, con la leyenda adentro y sin fondo, para mostrarlo y para descargarlo.
function curveSvg(d, m) {
  const W = 900, H = 370, pad = { l: 56, r: 24, t: 48, b: 38 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const step = m.bac > 4000 ? 1000 : 500;
  const yMax = Math.ceil(m.bac / step) * step;
  const x = (i) => pad.l + (iw * i) / (m.n - 1), y = (v) => pad.t + ih - (ih * v) / yMax;
  const o = [];
  const el = (tag, a, text) => o.push(`<${tag} ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(" ")}${text == null ? "/>" : `>${text}</${tag}>`}`);
  // Leyenda alineada a la izquierda: cada entrada empieza a la misma distancia del final de la anterior.
  // El ancho del texto se mide con canvas, igual que en tableSvg, con la misma fuente del SVG.
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = `400 12.5px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
  let lx = pad.l;
  [["PV · plan", "#334155", "6 5"], ["EV · valor terminado", "#2a78d6"], ["AC · costo real", "#eb6834"]].forEach(([label, c, dash]) => {
    const a = { x1: lx, x2: lx + 22, y1: 16, y2: 16, stroke: c, "stroke-width": 2 };
    if (dash) a["stroke-dasharray"] = dash;
    el("line", a);
    el("text", { x: lx + 28, y: 20, "font-size": 12.5, fill: "#0f172a" }, label);
    lx += 28 + ctx.measureText(label).width + 32;
  });
  for (let v = 0; v <= yMax; v += step) {
    el("line", { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v), stroke: v === 0 ? "#94a3b8" : "#e2e8f0", "stroke-width": 1 });
    el("text", { x: pad.l - 8, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "#64748b" }, usd(v));
  }
  d.weeks.forEach((w, i) => el("text", { x: x(i), y: H - pad.b + 18, "text-anchor": "middle", "font-size": 11, fill: "#64748b" }, w));
  // Sólo PV, EV y AC, con un punto por semana. EV y AC llegan hasta el corte; PV sigue hasta el final.
  const path = (arr) => arr.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const line = { fill: "none", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" };
  [[m.pv, "#334155", "6 5"], [m.ac, "#eb6834"], [m.ev, "#2a78d6"]].forEach(([arr, c, dash]) => {
    el("path", { d: path(arr), stroke: c, ...line, ...(dash ? { "stroke-dasharray": dash } : {}) });
    arr.forEach((v, i) => el("circle", { cx: x(i).toFixed(1), cy: y(v).toFixed(1), r: 3.5, fill: c }));
  });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Curva S: PV, EV y AC acumulados por semana">\n${o.join("\n")}\n</svg>\n`;
  return { svg, geo: { W, pad, iw } };
}

/* ---- Render ------------------------------------------------------------ */
function render(ver) {
  const d = STEERINGS[ver], m = compute(d);
  document.title = "SportMatch — " + d.name;
  $("t-name").textContent = d.name;
  $("foot").innerHTML = "Fuentes: " + d.sources;

  // Avance
  const [dn, dh] = d.avance.done, [wn, wh] = d.avance.wip, [tn, th] = d.avance.todo;
  const pkgs = dn + wn + tn, effort = dh + wh + th;
  const cal = m.c / m.n, done = dh / effort;
  $("avance-lead").textContent = `${pkgs} paquetes de desarrollo (${num(effort)} h) en ${m.n} semanas de trabajo, de jueves a jueves. Al corte van ${m.c}.`;
  $("avance-kpis").innerHTML =
    kpi("Esfuerzo cerrado", pct(done), `${num(dh)} h de ${num(effort)} h`, true) +
    kpi("Paquetes cerrados", `${dn} / ${pkgs}`, pct(dn / pkgs)) +
    kpi("Calendario", pct(cal), `${m.c} de ${m.n} semanas`) +
    kpi("Adelanto", (done >= cal ? "+" : "−") + num(Math.abs(done - cal) * 100, 1) + " pts", "avance sobre el calendario");
  $("avance-table").innerHTML = head([["Estado"], ["Paquetes", "num"], ["Esfuerzo", "num"], ["% del esfuerzo", "num"]]) + "<tbody>" +
    [["✅ Hecho", dn, dh], ["🟡 Parcial", wn, wh], ["⬜ Pendiente", tn, th]].map(([s, n, h]) => row([td(s), td(n, "num"), td(num(h) + " h", "num"), td(pct(h / effort), "num")])).join("") +
    row([td("Total"), td(pkgs, "num"), td(num(effort) + " h", "num"), td("100 %", "num")], "total") + "</tbody>";

  // Presupuesto
  $("pres-lead").textContent = `Horas-hombre a tarifas de referencia, a dedicación fija durante las ${m.n} semanas de trabajo (${d.start} → ${d.weeks[m.n - 1]}).`;
  $("pres-table").innerHTML = head([["Rol"], ["Tarifa", "num"], ["HH", "num"], ["Costo", "num"], ["Cómo se calcula"]]) + "<tbody>" +
    m.labor.map((r) => row([td(`<b>${r.rol}</b> (${r.who})`), td(usd(r.rate) + "/HH", "num"), td(r.hh, "num"), td(usd(r.cost), "num"), td(`${r.people} × ${r.hWeek} h/sem × ${m.n} sem`)])).join("") +
    d.other.map((o) => { const t = sum(Object.values(o.byWeek)); return row([td(o.name), td("—", "num"), td("—", "num"), td(usd(t, 2), "num"), td(t ? `semanas ${Object.keys(o.byWeek).join(", ")}` : "sin costo")]); }).join("") +
    row([td("Subtotal"), td(""), td(m.hh, "num"), td(usd(m.subtotal, 2), "num"), td("")], "total") +
    row([td(`Contingencia ${d.contingency * 100} %`), td(""), td(""), td(usd(m.contingency, 2), "num"), td("reserva para riesgos identificados")]) +
    row([td("BAC del proyecto"), td(""), td(m.hh, "num"), td(usd(m.total, 2), "num"), td("")], "total") + "</tbody>";
  $("pres-kpis").innerHTML =
    kpi("BAC del proyecto", usd(m.total), `subtotal + ${d.contingency * 100} % de contingencia`, true) +
    kpi("HH totales", m.hh, m.labor.map((r) => `${r.hh} ${r.rol.toLowerCase()}`).join(" · ")) +
    kpi("Contingencia", usd(m.contingency), `${d.contingency * 100} % del subtotal`) +
    kpi("Línea base EVM", usd(m.bac), m.loeWeek ? "desarrollo + leads + infra + IA" : "desarrollo + infra + IA");
  $("pres-note").innerHTML = `<b>Semana de reserva (${d.reserve}):</b> no lleva trabajo planificado y absorbe atrasos antes de la entrega final. Es reserva de gestión, así que queda fuera del BAC.`;

  // Valor ganado
  const k = m.c - 1;
  $("evm-lead").textContent = `Al corte de la semana ${m.c} (${d.weeks[k]}), sobre la línea base de desarrollo${m.loeWeek ? ", leads," : " más"} infra e IA: ${usd(m.bac, 2)} en ${m.n} semanas.`;
  $("evm-kpis-1").innerHTML =
    kpi("PV", usd(m.PV), `${(m.devWeek + m.loeWeekH) * m.c} h planificadas · ${pct(m.PV / m.bac)} de la línea base`) +
    kpi("EV", usd(m.EV), `${num(m.evH[k])} h de WBS cerradas${m.loeWeek ? " + leads" : ""} · ${pct(m.EV / m.bac)} de la línea base`, true) +
    kpi("AC", usd(m.AC), `${sum(d.actualHours) + sum(d.loeActualHours || [])} h de dedicación pactada`);
  $("evm-kpis-2").innerHTML =
    kpi("SPI", num(m.spi), trend(m.spi, "adelantados", "atrasados")) +
    kpi("CPI", num(m.cpi), trend(m.cpi, "eficientes", "sobre costo"));
  $("evm-formula").innerHTML = [
    `SV = EV − PV = ${signed(m.EV - m.PV)}`, `CV = EV − AC = ${signed(m.EV - m.AC)}`,
    m.loeWeek ? "EV = % completo × BAC desarrollo + PV leads" : "EV = % completo × BAC", "SPI = EV / PV", "CPI = EV / AC", `TCPI = ${num(m.tcpi)}`,
  ].map((f) => `<span>${f}</span>`).join("");
  $("evm-note").innerHTML = `<b>Cómo se mide el EV:</b> % completo × BAC. El % completo son las horas estimadas de los paquetes de la WBS cerrados sobre el esfuerzo total de desarrollo (${num(m.evH[k])} h / ${num(d.devEffort)} h). Los paquetes parciales no suman hasta cerrarse.` +
    (m.loeWeek ? ` Ese % se aplica al BAC de desarrollo (${usd(m.bacDev, 2)}). Los leads (${m.loeWeekH} h/sem) son nivel de esfuerzo: su trabajo no se cierra por paquetes, así que su EV es igual a su PV.` : "") +
    (d.acNote ? ` ${d.acNote}` : "");

  const { svg, geo } = curveSvg(d, m);
  const box = $("chart-box"), tip = $("tip");
  box.innerHTML = svg;
  box.appendChild(tip);
  const svgEl = box.querySelector("svg");
  svgEl.addEventListener("pointermove", (evt) => {
    const r = svgEl.getBoundingClientRect();
    const px = (evt.clientX - r.left) * (geo.W / r.width);
    const i = Math.max(0, Math.min(m.n - 1, Math.round((px - geo.pad.l) / (geo.iw / (m.n - 1)))));
    let html = `<b>Semana ${i + 1} · ${d.weeks[i]}</b><div class="row"><span>PV</span><span>${usd(m.pv[i])}</span></div>`;
    html += i < m.c
      ? `<div class="row"><span>EV</span><span>${usd(m.ev[i])}</span></div><div class="row"><span>AC</span><span>${usd(m.ac[i])}</span></div><div class="row"><span>SPI</span><span>${num(m.ev[i] / m.pv[i])}</span></div>`
      : `<div class="row"><span>EV / AC</span><span>pendiente</span></div>`;
    tip.innerHTML = html;
    const bx = box.getBoundingClientRect();
    let left = evt.clientX - bx.left + 14;
    if (left + 190 > bx.width) left = evt.clientX - bx.left - 200;
    tip.style.left = left + "px";
    tip.style.top = Math.max(0, evt.clientY - bx.top - 40) + "px";
    tip.style.opacity = 1;
  });
  svgEl.addEventListener("pointerleave", () => { tip.style.opacity = 0; });
  $("svg-dl").onclick = () => download(svg, `SportMatch-Steering-${ver}-curva-s.svg`);

  // Semana a semana: la foto de cualquier semana hasta el corte, con los mismos datos de la tabla.
  const showGlobal = () => {
    $("wk-pick").querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-pressed", j === 0));
    $("wk-kpis").innerHTML =
      kpi("Línea base EVM", usd(m.bac), `BAC del proyecto ${usd(m.total)} con ${d.contingency * 100} % de contingencia`) +
      kpi("EV", usd(m.EV), `${pct(m.EV / m.bac)} de la línea base ganado`, true) +
      kpi("AC", usd(m.AC), `${pct(m.AC / m.bac)} de la línea base gastado`) +
      kpi("SPI", num(m.spi), trend(m.spi, "adelantados", "atrasados")) +
      kpi("CPI", num(m.cpi), trend(m.cpi, "eficientes", "sobre costo"));
    $("wk-read").innerHTML = `<b>Lectura:</b> en ${m.c} de ${m.n} semanas (${pct(m.c / m.n)} del calendario) el equipo ganó el ${pct(m.EV / m.bac)} de la línea base EVM (${usd(m.bac)}) ` +
      `y gastó el ${pct(m.AC / m.bac)}. `+
      `Quedan ${num(d.devEffort - m.evH[k])} h de WBS por cerrar.`;
  };
  const showWeek = (i) => {
    const spi = m.ev[i] / m.pv[i], cpi = m.ev[i] / m.ac[i];
    $("wk-pick").querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-pressed", j === i + 1));
    $("wk-kpis").innerHTML =
      kpi(`PV · semana ${i + 1}`, usd(m.pv[i]), `al ${d.weeks[i]}`) + kpi("EV", usd(m.ev[i]), `${num(m.evH[i])} h de WBS cerradas`, true) +
      kpi("AC", usd(m.ac[i]), "costo real acumulado") +
      kpi("SPI", num(spi), trend(spi, "adelantados", "atrasados")) + kpi("CPI", num(cpi), trend(cpi, "eficientes", "sobre costo"));
    $("wk-read").innerHTML = `<b>Lectura:</b> al ${d.weeks[i]} el trabajo terminado vale ${usd(m.ev[i])} contra ${usd(m.pv[i])} planificados ` +
      `(${signed(m.ev[i] - m.pv[i])}) y costó ${usd(m.ac[i])} (${signed(m.ev[i] - m.ac[i])} de diferencia con lo ganado). ` +
      `Esa semana cierran: ${d.earned[i].pkgs.join(", ") || "ningún paquete"}.`;
  };
  $("wk-pick").innerHTML = `<button class="btn" type="button" aria-pressed="false">Global</button>` +
    d.earned.map((_, i) => `<button class="btn" type="button" aria-pressed="false">Sem ${i + 1}</button>`).join("");
  $("wk-pick").querySelectorAll("button").forEach((b, j) => (b.onclick = () => (j ? showWeek(j - 1) : showGlobal())));
  showGlobal();

  $("evm-table").innerHTML = head([["Sem."], ["Cierre"], ["PV acum.", "num"], ["EV acum.", "num"], ["AC acum.", "num"], ["Horas ganadas", "num"], ["SPI", "num"], ["CPI", "num"], ["Paquetes cerrados"]]) + "<tbody>" +
    d.earned.map((e, i) => row([td(i + 1), td(d.weeks[i]), td(usd(m.pv[i]), "num"), td(usd(m.ev[i]), "num"), td(usd(m.ac[i]), "num"), td(num(e.h) + " h", "num"), td(num(m.ev[i] / m.pv[i]), "num"), td(num(m.ev[i] / m.ac[i]), "num"), td(e.pkgs.join(", "), "ids")], i === k ? "cut" : "")).join("") + "</tbody>";

  // Qué recalcar: conceptos de EVM con los números de este steering
  const li = (items) => items.filter(Boolean).map((x) => `<li>${x}</li>`).join("");
  $("pres-recalcar").innerHTML = li([
    `<b>BAC = línea base de costos:</b> el costo del trabajo más la <b>contingencia</b> (${d.contingency * 100} %), que cubre riesgos ya identificados. La reserva de gestión, para imprevistos, queda fuera: por eso la semana de reserva no suma.`,
    "Presupuestamos por <b>esfuerzo</b> (HH × tarifa), no por calendario. Por eso el presupuesto se compara directo con el avance.",
    m.loeWeek
      ? `La <b>línea base EVM incluye a los leads</b> (${usd(m.bac)}): desarrollo se mide por paquetes cerrados de la WBS; gestión y QA son nivel de esfuerzo, con EV = PV. En el Steering 1 la base era solo desarrollo y su valor no aparecía.`
      : `El <b>valor ganado se ancla en desarrollo</b> más infra e IA (${usd(m.bac)}): es donde hay entregables medibles. Gestión y QA son nivel de esfuerzo y quedan en el BAC del proyecto.`,
    "La <b>PV no es lineal</b>: los costos mensuales de IA y de Azure generan escalones en la curva.",
  ]);
  const weak = d.earned.map((_, i) => i).filter((i) => m.ev[i] / m.pv[i] < 1);
  $("evm-recalcar").innerHTML = li([
    Math.abs(m.PV - m.AC) < 0.005 && `<b>PV = AC no es casualidad:</b> el AC no sale de horas cargadas —no hay time tracking— sino de la <b>dedicación pactada</b> de ${m.devWeek + m.loeWeekH} h/sem, que el equipo sostuvo las ${m.c} semanas, más los costos de infra e IA, que fueron los planeados. Por eso <b>SPI = CPI</b>, y toda la diferencia está en el EV: cuánto valor rinde cada hora.`,
    m.loeWeek && `<b>Los leads acercan los índices a 1:</b> como su EV es igual a su PV, diluyen el desvío. Midiendo solo desarrollo, infra e IA, el SPI da <b>${num(m.spiDev)}</b>.`,
    `<b>SPI ${m.spi >= 1 ? "&gt;" : "&lt;"} 1 no significa «terminamos ${m.spi >= 1 ? "antes" : "después"}»:</b> significa que el trabajo entregado a la fecha vale ${m.spi >= 1 ? "más" : "menos"} que el planificado a la fecha: <b>${pct(m.EV / m.bac)} ganado vs ${pct(m.PV / m.bac)} planificado</b>.`,
    `<b>TCPI = ${num(m.tcpi)}:</b> para terminar dentro del presupuesto alcanza con rendir al ${Math.round(m.tcpi * 100)} % de lo planificado.`,
    weak.length && `<b>Semanas con SPI &lt; 1:</b> ${weak.map((i) => `semana ${i + 1} (${num(m.ev[i] / m.pv[i])})`).join(", ")}. El EV sube cuando cierra un paquete, no mientras se trabaja: las semanas en que cierran paquetes grandes compensan a las anteriores.`,
  ]);

  // Hitos y riesgos
  $("hitos-table").innerHTML = head([["Hito"], ["Fecha comprometida"], ["Plan"], ["Estado"]]) + "<tbody>" + d.hitos.map((h) => row(h.map((c) => td(c)))).join("") + "</tbody>";
  $("riesgos-table").innerHTML = head([["#"], ["Riesgo"], ["Impacto"], ["Mitigación"]]) + "<tbody>" + d.riesgos.map((r) => row(r.map((c) => td(c)))).join("") + "</tbody>";
}

/* ---- Exportar a SVG sin fondo ---------------------------------------- */
function download(svg, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

// Dibuja una tabla HTML ya renderizada como SVG: mismas columnas, alineación y negritas.
function tableSvg(table) {
  const FONT = "-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
  const ctx = document.createElement("canvas").getContext("2d");
  const measure = (t, size, bold) => { ctx.font = `${bold ? 700 : 400} ${size}px ${FONT}`; return ctx.measureText(t).width; };
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const PAD = 10, LINE = 18, MAXW = 300;
  const rows = [...table.rows].filter((tr) => !tr.classList.contains("det")).map((tr) => ({
    head: tr.parentElement.tagName === "THEAD",
    cls: tr.className,
    cells: [...tr.cells].map((c) => ({ text: c.textContent.trim(), num: c.classList.contains("num"), muted: c.classList.contains("ids") })),
  }));
  const style = (r) => r.head ? { size: 11, bold: true, fill: "#64748b", upper: true } : { size: 13, bold: r.cls === "total" || r.cls === "cut", fill: "#0f172a" };
  const wrap = (text, st) => {
    const words = text.split(" "), lines = [];
    let cur = "";
    for (const w of words) {
      const next = cur ? cur + " " + w : w;
      if (cur && measure(next, st.size, st.bold) > MAXW) { lines.push(cur); cur = w; } else cur = next;
    }
    return lines.concat(cur);
  };
  const cols = Math.max(...rows.map((r) => r.cells.length));
  const width = Array(cols).fill(0);
  rows.forEach((r) => r.cells.forEach((c, i) => {
    const st = style(r), t = st.upper ? c.text.toUpperCase() : c.text;
    width[i] = Math.max(width[i], Math.min(MAXW, measure(t, st.size, st.bold)) + 2 * PAD);
  }));
  const x0 = width.map((_, i) => width.slice(0, i).reduce((a, b) => a + b, 0));
  const W = Math.ceil(x0[cols - 1] + width[cols - 1]);
  const out = [];
  let y = 0;
  for (const r of rows) {
    const st = style(r);
    const lines = r.cells.map((c) => wrap(st.upper ? c.text.toUpperCase() : c.text, st));
    const h = Math.max(...lines.map((l) => l.length)) * LINE + 2 * 8;
    if (r.cls === "cut") out.push(`<rect x="0" y="${y}" width="${W}" height="${h}" fill="#fdf2ec"/>`);
    if (r.cls === "total") out.push(`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#0f172a" stroke-width="2"/>`);
    r.cells.forEach((c, i) => {
      const right = c.num, x = right ? x0[i] + width[i] - PAD : x0[i] + PAD;
      const fill = c.muted ? "#64748b" : st.fill, size = c.muted ? 12 : st.size;
      lines[i].forEach((ln, k) => out.push(`<text x="${x.toFixed(1)}" y="${y + 8 + LINE * k + 13}" font-size="${size}"${st.bold ? ' font-weight="700"' : ""}${right ? ' text-anchor="end"' : ""} fill="${fill}">${esc(ln)}</text>`));
    });
    y += h;
    out.push(`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`);
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${y}" width="${W}" height="${y}" font-family="${FONT}">\n${out.join("\n")}\n</svg>\n`;
}

document.querySelectorAll("[data-export]").forEach((btn) => {
  btn.addEventListener("click", () => download(tableSvg($(btn.dataset.export)), `SportMatch-Steering-${verSelect.value}-${btn.dataset.name}.svg`));
});

const verSelect = $("ver-select");
const versions = Object.keys(STEERINGS);
verSelect.innerHTML = versions.map((v) => `<option value="${v}">${v}</option>`).join("");
verSelect.value = versions[versions.length - 1];
verSelect.addEventListener("change", () => render(verSelect.value));
render(verSelect.value);

// Actividades clave: independiente de la versión del steering, se elige la semana.
const ESTADO = { "Finaliz.": "✅ Finaliz.", "En curso": "🟡 En curso", "Pend.": "⬜ Pend." };
const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function renderActividades(week) {
  const rows = ACTIVIDADES[week];
  const done = rows.filter((r) => r.estado === "Finaliz.").length;
  $("act-lead").textContent = `Semana que cierra el ${week.split("-").reverse().join("/")}: ${done} de ${rows.length} finalizadas. Desvío en días contra la línea base; positivo es antes de lo planeado.`;
  const cols = [["Actividad"], ["Estado"], ["Avance", "num"], ["F. fin base", "num"], ["F. fin estimado", "num"], ["F. fin real", "num"], ["Desvío", "num"]];
  $("act-table").innerHTML = head(cols) + "<tbody>" +
    rows.map((r) => `<tr class="act" tabindex="0" aria-expanded="false" title="Ver cómo se calcula el avance">${[
      td(`${esc(r.actividad)} <span class="ids">${esc(r.wbs)}</span>`), td(ESTADO[r.estado] || esc(r.estado)), td(r.avance + " %", "num"),
      td(r.base, "num"), td(r.estimado, "num"), td(r.real, "num"),
      td(r.desvio == null ? "" : `<span class="${r.desvio >= 0 ? "up" : "down"}">${r.desvio > 0 ? "+" : ""}${r.desvio}</span>`, "num"),
    ].join("")}</tr><tr class="det" hidden><td colspan="${cols.length}">${detalle(r)}</td></tr>`).join("") + "</tbody>";
}

// Avance = puntos de los issues en Done / puntos de todos los issues de la actividad. Igual que generate-v4.py.
function detalle(r) {
  if (!r.detalle) return `<p class="det-note">Este snapshot no guardó el desglose.</p>`;
  if (!r.detalle.length) return `<p class="det-note">Sin issues en Linear: el avance calculado es 0 %.</p>` + (r.avance !== r.calc ? `<p class="note">Avance cargado a mano: ${r.avance} %.</p>` : "");
  const total = sum(r.detalle.map((i) => i[4])), hechos = sum(r.detalle.filter((i) => i[3] === "completed").map((i) => i[4]));
  return `<p class="det-formula">Avance = puntos en Done / puntos totales = <b>${hechos} / ${total} pts = ${r.calc} %</b></p>` +
    (r.avance !== r.calc ? `<p class="note">Avance cargado a mano: ${r.avance} %. El cálculo da ${r.calc} %.</p>` : "") +
    `<table class="det-table">${head([["Issue"], ["Estado"], ["Puntos", "num"], ["Suma", "num"]])}<tbody>` +
    r.detalle.map(([key, t, s, k, e]) => `<tr class="iss"><td><a class="key" href="https://linear.app/sportmatch-dirproy/issue/${key}" target="_blank" rel="noopener">${key}</a>${esc(t)}</td><td><span class="pill ${k}">${esc(s)}</span></td><td class="num">${e}</td><td class="num">${k === "completed" ? e : "—"}</td></tr>`).join("") +
    `<tr class="total"><td>Total</td><td></td><td class="num">${total}</td><td class="num">${hechos}</td></tr></tbody></table>` +
    `<p class="det-note">Solo suman los issues en Done. No cuentan los cancelados ni los arreglos sobre paquetes ya cerrados (fechas = no en el mapa).</p>`;
}
const toggleAct = (tr) => {
  const open = tr.nextElementSibling.hidden;
  tr.nextElementSibling.hidden = !open;
  tr.classList.toggle("open", open);
  tr.setAttribute("aria-expanded", open);
};
$("act-table").addEventListener("click", (e) => { const tr = e.target.closest("tr.act"); if (tr && !e.target.closest("a")) toggleAct(tr); });
$("act-table").addEventListener("keydown", (e) => { const tr = e.target.closest("tr.act"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleAct(tr); } });
const actSelect = $("act-select");
const actWeeks = Object.keys(ACTIVIDADES).reverse();
actSelect.innerHTML = actWeeks.map((w) => `<option value="${w}">${w.split("-").reverse().slice(0, 2).join("/")}</option>`).join("");
actSelect.addEventListener("change", () => renderActividades(actSelect.value));
renderActividades(actWeeks[0]);
</script>
