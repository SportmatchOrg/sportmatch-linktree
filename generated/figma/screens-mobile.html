<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SportMatch — Flujo mobile</title>

<link rel="stylesheet" href="/prototype/sportmatch/design-system/tokens/colors.css">
<link rel="stylesheet" href="/prototype/sportmatch/design-system/tokens/typography.css">
<link rel="stylesheet" href="/prototype/sportmatch/design-system/tokens/spacing.css">
<link rel="stylesheet" href="/prototype/sportmatch/design-system/tokens/effects.css">
<link rel="stylesheet" href="/prototype/sportmatch/design-system/tokens/base.css">
<link rel="stylesheet" href="/prototype/sportmatch/design-system/styles.css">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/prototype/sportmatch/design-system/bundle.js"></script>
<script src="photo-data.js"></script>
<script src="/prototype/sportmatch/app/overrides.js"></script>
<script src="/prototype/sportmatch/app/SportMatchApp.jsx"></script>
<style>
  html, body { margin: 0; background: #0b0d11; }
  body { font-family: var(--font-text), system-ui, sans-serif; padding: 80px 64px 120px; }
  h1.sheet-title { font-family: var(--font-display), system-ui; font-weight: 800; font-size: 44px;
    letter-spacing: -0.03em; color: #fff; margin: 0 0 10px; }
  p.sheet-sub { font-size: 16px; color: rgba(255,255,255,0.5); margin: 0 0 20px; max-width: 720px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 64px; }
  .legend span { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.62);
    padding: 7px 14px; border-radius: 99px; background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.10); }
  .legend b { color: #4EA8FF; font-weight: 700; }
  .legend i { font-style: normal; color: rgba(255,255,255,0.28); font-size: 15px; }
  .phase { margin-bottom: 84px; }
  .phase > .ph-head { display: flex; align-items: baseline; gap: 14px; margin: 0 0 26px; }
  .phase > .ph-head .ph-n { font-family: var(--font-display), system-ui; font-weight: 800; font-size: 15px;
    letter-spacing: 0.14em; color: #4EA8FF; }
  .phase > .ph-head .ph-t { font-family: var(--font-display), system-ui; font-weight: 700; font-size: 26px;
    letter-spacing: -0.02em; color: #fff; }
  .phase > .ph-head .ph-s { font-size: 15px; color: rgba(255,255,255,0.44); }
  .flow { display: flex; align-items: flex-start; gap: 30px; flex-wrap: wrap; }
  .arrow { flex: none; align-self: center; margin-top: 34px; color: rgba(255,255,255,0.30);
    font-size: 26px; line-height: 1; }
  .frame { display: flex; flex-direction: column; gap: 12px; }
  .frame > .step { display: flex; align-items: center; gap: 10px; }
  .frame > .step .num { font-family: var(--font-numeric), var(--font-display), system-ui; font-weight: 800;
    font-size: 13px; color: #05101c; background: #4EA8FF; border-radius: 99px;
    min-width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; }
  .frame > .step .nm { font-family: var(--font-display), system-ui; font-weight: 700; font-size: 17px;
    letter-spacing: -0.02em; color: #fff; }
  .frame > .note { font-size: 13px; color: rgba(255,255,255,0.42); max-width: 390px; line-height: 1.4; }
  .device { position: relative; width: 390px; height: 844px; background: #000;
    border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,0.10); }
  .device .leaflet-container { background: #0a0d12; font-family: var(--font-text); }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#05060a">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#05060a"/>
    <circle cx="600" cy="370" r="180" fill="none" stroke="#4EA8FF" stroke-width="20"/>
    <path d="M600 190v360M420 370h360" stroke="#4EA8FF" stroke-width="20" stroke-linecap="round"/>
    <circle cx="600" cy="370" r="54" fill="#4EA8FF"/>
    <text x="600" y="680" text-anchor="middle" font-family="system-ui,sans-serif"
      font-weight="800" font-size="74" fill="#fff" letter-spacing="-2">Flujo</text>
  </svg>
</template>

<h1 class="sheet-title">SportMatch — Flujo mobile</h1>
<p class="sheet-sub">App mobile · iPhone 390 × 844 · 14 pantallas ordenadas según el recorrido real del jugador,
  desde el primer ingreso hasta la gestión de su cuenta.</p>
<div class="legend">
  <span><b>1</b> Acceso</span><i>→</i>
  <span><b>2</b> Descubrir</span><i>→</i>
  <span><b>3</b> Sumarse</span><i>→</i>
  <span><b>4</b> Organizar</span><i>→</i>
  <span><b>5</b> Cuenta</span>
</div>
<div id="flow"></div>

<script>
(function () {
  // Fases del flujo → pantallas, en el orden en que el jugador las recorre.
  var PHASES = [
    ['1', 'Acceso', 'Primer contacto: entrar o crear la cuenta', [
      ['login', '01', 'Iniciar sesión', 'Entrada por defecto. Email y contraseña, o Google. Deriva al mapa.'],
      ['register', '02', 'Crear cuenta', 'Nombre, email y contraseña con validación. Vuelve a iniciar sesión.']
    ]],
    ['2', 'Descubrir', 'Ver qué se juega cerca, de dos maneras', [
      ['map', '03', 'Mapa de partidos', 'Pantalla de inicio. Pines por deporte, búsqueda y filtros por día y nivel.'],
      ['swipe', '04', 'Descubrir', 'Mazo de tarjetas: deslizar a la derecha para sumarse, a la izquierda para pasar.']
    ]],
    ['3', 'Sumarse', 'Evaluar un partido y reservar el lugar', [
      ['detail', '05', 'Detalle del partido', 'Foto, quién organiza, horario, nivel y quién juega. CTA: unirse o cancelar.']
    ]],
    ['4', 'Organizar', 'Crear tu propio partido y administrarlo', [
      ['create1', '06', 'Crear · Deporte', 'Paso 1. Elegir el deporte del partido.'],
      ['create2', '07', 'Crear · Lugar', 'Paso 2. Buscar la cancha o elegir un lugar frecuente.'],
      ['create3', '08', 'Crear · Horario', 'Paso 3. Día, hora y minutos con selectores horizontales.'],
      ['create4', '09', 'Crear · Jugadores', 'Paso 4. Cantidad de jugadores, nivel y descripción.'],
      ['create5', '10', 'Crear · Revisión', 'Paso 5. Resumen del partido antes de publicar.'],
      ['matches', '11', 'Tus partidos', 'Los que organizás (con solicitudes para aceptar) y los que jugás.']
    ]],
    ['5', 'Cuenta', 'Identidad, historial y configuración', [
      ['profile', '12', 'Perfil', 'Puntaje, partidos jugados, racha e historial reciente.'],
      ['settings', '13', 'Ajustes', 'Editar perfil, compartir perfil y cerrar sesión.'],
      ['editprofile', '14', 'Editar perfil', 'Foto, nombre, ciudad y cambio de contraseña.']
    ]]
  ];

  var root = document.getElementById('flow');
  PHASES.forEach(function (ph) {
    var sec = document.createElement('div');
    sec.className = 'phase';
    var head = document.createElement('div');
    head.className = 'ph-head';
    head.innerHTML = '<span class="ph-n">FASE ' + ph[0] + '</span>' +
      '<span class="ph-t">' + ph[1] + '</span><span class="ph-s">' + ph[2] + '</span>';
    sec.appendChild(head);
    var row = document.createElement('div');
    row.className = 'flow';
    ph[3].forEach(function (s, i) {
      if (i) { var ar = document.createElement('div'); ar.className = 'arrow'; ar.textContent = '→'; row.appendChild(ar); }
      var wrap = document.createElement('div');
      wrap.className = 'frame';
      var step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = '<span class="num">' + s[1] + '</span><span class="nm">' + s[2] + '</span>';
      var note = document.createElement('div');
      note.className = 'note';
      note.textContent = s[3];
      var dev = document.createElement('div');
      dev.className = 'device';
      dev.setAttribute('data-screen-label', s[1] + ' · ' + s[2]);
      wrap.appendChild(step);
      wrap.appendChild(note);
      wrap.appendChild(dev);
      row.appendChild(wrap);
      ReactDOM.createRoot(dev).render(
        React.createElement(window.SportMatchApp, { forceScreen: s[0] })
      );
    });
    sec.appendChild(row);
    root.appendChild(sec);
  });
})();
</script>
</body>
</html>
