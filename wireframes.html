<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportMatch — Interactive Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #05060a; overflow: hidden; }
    :root { --phone-scale: 1; }
    body {
      display: grid;
      place-items: center;
      padding: 0;
    }
    .phone-shell {
      position: relative;
      width: calc(416px * var(--phone-scale));
      height: calc(870px * var(--phone-scale));
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 416px;
      height: 870px;
      border: none;
      display: block;
      transform: scale(var(--phone-scale));
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <iframe
      src="Design/Sportmatch mobile app redesign/SportMatch.dc.html?frame=1"
      title="SportMatch interactive prototype"
      allow="geolocation"
    ></iframe>
  </div>
  <script>
    (function () {
      function fitPhone() {
        var safeMargin = 96;
        var scale = Math.min(1, (window.innerWidth - safeMargin) / 416, (window.innerHeight - safeMargin) / 870);
        document.documentElement.style.setProperty('--phone-scale', Math.max(0.1, scale).toFixed(4));
      }

      window.addEventListener('resize', fitPhone);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fitPhone);
      fitPhone();
    })();
  </script>
</body>
</html>
