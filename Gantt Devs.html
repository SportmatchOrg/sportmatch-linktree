<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportMatch — Cronograma de Desarrollo (Devs)</title>
<style>
  :root{
    --row-h: 32px;
    --label-w: 320px;
    --header-h: 64px;
    --bg: #f8fafc;
    --panel: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --weekend: rgba(15,23,42,0.035);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header.app{
    padding: 18px 24px 14px;
    background: linear-gradient(180deg,#ffffff, #fbfdff);
    border-bottom: 1px solid var(--border);
  }
  header.app h1{ margin:0; font-size: 20px; letter-spacing: -0.01em; }
  header.app .sub{ margin-top: 4px; color: var(--muted); font-size: 13px; }

  .controls{
    display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center;
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; z-index: 60;
    font-size: 13px;
  }
  .controls label{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .controls .group{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .controls .sep{ width:1px; height:20px; background:var(--border); }
  .controls button{
    font: inherit; font-size:13px; cursor:pointer;
    border:1px solid var(--border); background:#fff; color:var(--ink);
    padding:5px 12px; border-radius:8px;
  }
  .controls button:hover{ background:#f1f5f9; }

  .legend{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .legend .item{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .legend .swatch{ width:12px; height:12px; border-radius:3px; }
  .legend .dev{ display:inline-flex; align-items:center; gap:5px; }
  .legend .devbar{ width:22px; height:12px; border-radius:3px; background:#94a3b8; }
  .legend .devbar.d2{ background:#94a3b8; border:2px dashed #475569; height:12px; }
  .legend .crit-box{ width:18px; height:12px; border-radius:3px; border:2.4px solid #dc2626; background:#fff; display:inline-block; box-sizing:border-box; }

  .chart-wrap{
    overflow: auto;
    max-height: calc(100vh - 0px);
    position: relative;
    background: var(--panel);
  }
  .grid{
    position: relative;
    display: grid;
    grid-template-columns: var(--label-w) 1fr;
    min-width: max-content;
  }

  .corner{
    position: sticky; left:0; top:0; z-index: 50;
    background: var(--panel);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    height: var(--header-h);
    display:flex; align-items:flex-end;
    padding: 6px 12px;
    font-size: 11px; color: var(--muted); font-weight:600;
    text-transform: uppercase; letter-spacing: .04em;
  }

  .timeline-head{
    position: sticky; top:0; z-index: 40;
    height: var(--header-h);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .labels{
    position: sticky; left:0; z-index: 30;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  .grp-label{
    display:flex; align-items:center; gap:8px;
    height: var(--row-h);
    padding: 0 12px;
    font-weight: 700; font-size: 12.5px;
    border-bottom: 1px solid var(--border);
    background: #fbfcfe;
    cursor: pointer;

  .grp-label .caret{ width:12px; text-align:center; color:var(--muted); font-size:10px; flex:none; }

  .grp-label .gname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grp-label .count{ margin-left:auto; color:var(--muted); font-weight:500; font-size:11px; flex:none; }
  .task-label{
    display:flex; align-items:center; gap:8px;
    height: var(--row-h);
    padding: 0 12px 0 26px;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap; overflow:hidden;

  .task-label:hover{ background:#f8fafc; }
  .task-label.dim{ opacity: .32; }
  .task-label .idx{ color:var(--muted); font-variant-numeric: tabular-nums; flex:none; }
  .task-label .nm{ overflow:hidden; text-overflow:ellipsis; }
  .task-label .spo{
    margin-left:auto; flex:none;
    font-size:10px; color:#475569; background:#eef2f7;
    border-radius:6px; padding:1px 6px;
  }

  .plot{ position: relative; }
  .plot-rows{ position: relative; }
  .row-line{ height: var(--row-h); border-bottom: 1px solid var(--border); }
  .row-line.grp{ background:#fbfcfe; }

  svg.overlay{ position:absolute; top:0; left:0; pointer-events:none; }
  svg.bars{ position:absolute; top:0; left:0; }

  .tooltip{
    position: fixed; z-index: 100;
    pointer-events:none;
    background: rgba(15,23,42,0.96);
    color:#f8fafc;
    border-radius: 10px;

  .tooltip dt{ color:#94a3b8; }
  .tooltip dd{ margin:0; }

  @media print{
    .controls{ position:static; }
    .chart-wrap{ max-height:none; overflow:visible; }
    body{ background:#fff; }
  }
</style>
</head>

/* ---------------- LEVEL-2 AGGREGATION ---------------- */
const WBS_NAMES = {
  "3.1":"Configuración técnica",   "3.2":"Setup del entorno",
  "4.1":"Autenticación backend",   "4.2":"Auth frontend",
  "5.1":"Backend de perfil",       "5.2":"Frontend de perfil",
  "6.1":"Backend de partidos",     "6.2":"Frontend de partidos",
  "6.3":"Solicitudes",             "6.4":"Calificación",
  "7.1":"Motor de búsqueda",       "7.2":"Experiencia swipe",
  "7.3":"Visualización en mapa",
  "9.1":"Despliegue",
  "10.2":"Docs técnicas",
};

function l2id(id){ const p=id.split('.'); return p[0]+'.'+p[1]; }

function aggregateL2(raw){
  const map={};
  // preserve insertion order (sorted by first child start, then id)
  raw.forEach(t => {
    const gid=l2id(t.id);
    if(!map[gid]) map[gid]={ id:gid, mod:t.mod, name:WBS_NAMES[gid]||gid,
      start:t.start, end:t.end, hours:0, devH:{1:0,2:0}, deps:new Set() };
    const g=map[gid];
    if(new Date(t.start)<new Date(g.start)) g.start=t.start;
    if(new Date(t.end)  >new Date(g.end))   g.end  =t.end;
    g.hours+=t.hours;
    g.devH[t.dev]=(g.devH[t.dev]||0)+t.hours;
    t.deps.forEach(d=>{ const pd=l2id(d); if(pd!==gid) g.deps.add(pd); });
  });
  return Object.values(map).map(g=>({
    id:g.id, mod:g.mod, name:g.name,
    dev:g.devH[2]>g.devH[1]?2:1,
    start:g.start, end:g.end, hours:g.hours,
    deps:[...g.deps], spo:''
  }));
}

/* ---------------- TIME SCALE ---------------- */
const RANGE_START = "2026-07-30";
const RANGE_END   = "2026-11-12";
const DAY_MS = 86400000;
const SVGNS = "http://www.w3.org/2000/svg";

function parse(d){ const [y,m,dd] = d.split("-").map(Number); return new Date(Date.UTC(y, m-1, dd)); }
function days(a,b){ return Math.round((parse(b)-parse(a))/DAY_MS); }

const rangeStart = parse(RANGE_START);
const rangeEnd   = parse(RANGE_END);
const totalDays  = days(RANGE_START, RANGE_END) + 1;

const DAY_W = 11;
const WEEK_W = 74;          // ancho de columna en vista por semanas
const ROW_H = 32;
const HEADER_H = 64;

const numWeeks = Math.ceil(totalDays / 7);

// --- escala dependiente del modo (días / semanas) ---
function dayIndex(d){ return (parse(d) - rangeStart) / DAY_MS; }
function weekIndex(d){ return Math.floor(dayIndex(d) / 7); }
function plotW(){ return state.weekMode ? numWeeks * WEEK_W : totalDays * DAY_W; }
// posición x de un instante (para líneas verticales: hitos, hoy, bordes de sprint)
function xLine(d){ return state.weekMode ? (dayIndex(d) / 7) * WEEK_W : dayIndex(d) * DAY_W; }
// geometría de una barra start..end (inclusive). En semanas se ajusta a columnas enteras.
function barGeom(start, end){
  if(state.weekMode){
    const ws = weekIndex(start), we = weekIndex(end);
    return { x: ws * WEEK_W, w: (we - ws + 1) * WEEK_W };
  }
  return { x: dayIndex(start) * DAY_W, w: Math.max(DAY_W, (days(start, end)+1) * DAY_W) };
}
function xForDate(d){ return xLine(d); } // compat

/* ---------------- GROUPS ---------------- */
const modOrder = Object.keys(MOD_COLORS);
const groups = modOrder.map(mod => ({
  mod, color: MOD_COLORS[mod],
  tasks: TASKS.filter(t => t.mod === mod).sort((a,b)=> parse(a.start)-parse(b.start) || a.id.localeCompare(b.id))
})).filter(g => g.tasks.length);

const taskById = {};
TASKS.forEach(t => taskById[t.id] = t);
const successors = {};
TASKS.forEach(t => t.deps.forEach(d => { (successors[d] = successors[d]||[]).push(t.id); }));

groups.forEach(g => {
  g.minStart = g.tasks.reduce((m,t)=> parse(t.start) < parse(m) ? t.start : m, g.tasks[0].start);
  g.maxEnd   = g.tasks.reduce((m,t)=> parse(t.end)   > parse(m) ? t.end   : m, g.tasks[0].end);
  g.totalHours = g.tasks.reduce((s,t)=> s + t.hours, 0);
});

/* ---------------- CRITICAL PATH (cadena crítica del cronograma nivelado) ----------------
   Calculada con el scheduler de recursos (2 devs · 6 h/sem, nivelación greedy por criticidad).
   Es la cadena CONTIGUA de tareas que fija el fin del proyecto: incluye enlaces por
   dependencia y por recurso (el dev ocupado encadena una tarea con la siguiente). */
const CRITICAL_PATH = [...new Set(
  ["4.1.1","6.1.3","6.3.1","6.2.3","9.1.1","6.3.2","6.4.3","7.2.1","5.1.4","7.2.2","6.2.1","7.1.3","6.2.2","5.2.2","5.2.3","9.1.2","9.1.3","10.2.1"]
  .map(l2id)
)];
const criticalSet = new Set(CRITICAL_PATH);
const criticalEdges = new Set();
for(let i=0;i<CRITICAL_PATH.length-1;i++){
  const a = CRITICAL_PATH[i], b = CRITICAL_PATH[i+1];
  if((taskById[b]?.deps || []).includes(a)) criticalEdges.add(a + ">" + b);
}

/* ---------------- STATE ---------------- */
const state = { collapsed:{}, highlighted:null, showDeps:false, showCrit:true, showWeekend:true, showSprints:true, showDev:{1:true, 2:true}, weekMode:false };

/* ---------------- STATIC: TIMELINE HEADER ---------------- */
const headSvg = document.getElementById("headSvg");
const MONTHS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function svgEl(name, attrs){
  const e = document.createElementNS(SVGNS, name);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// three horizontal bands: month (top) · hitos (middle) · número de semana/día (bottom)
const Y_MONTH = 14, Y_MILE = 36, Y_WEEK = HEADER_H - 7, WEEK_BAND_TOP = HEADER_H - 18;
function buildHeader(){
  headSvg.innerHTML = "";
  const W = plotW();
  headSvg.setAttribute("width", W);
  headSvg.setAttribute("height", HEADER_H);

  // month band + bottom-band ticks (per-day in day mode, per-week in week mode)
  let monthStartX = 0, curMonth = rangeStart.getUTCMonth(), curYear = rangeStart.getUTCFullYear();
  const step = state.weekMode ? 7 : 1;
  for(let i=0; i<=totalDays; i += (state.weekMode ? 7 : 1)){
    const x = state.weekMode ? (i/7)*WEEK_W : i*DAY_W;
    const dt = new Date(rangeStart.getTime() + i*DAY_MS);
    const beyond = i >= totalDays;
    if(beyond || dt.getUTCMonth()!==curMonth){
      const mid = (monthStartX + x)/2;
      const lbl = svgEl("text", { x:mid, y:Y_MONTH, "text-anchor":"middle", "font-size":12.5, "font-weight":700, fill:"#1e293b" });
      lbl.textContent = MONTHS[curMonth] + " " + (curYear%100);
      headSvg.appendChild(lbl);
      headSvg.appendChild(svgEl("line",{ x1:x, y1:0, x2:x, y2:HEADER_H, stroke:"#cbd5e1","stroke-width":1 }));
      if(!beyond){ curMonth = dt.getUTCMonth(); curYear = dt.getUTCFullYear(); monthStartX = x; }
    }
    if(beyond) break;
    const isWeekStart = state.weekMode || dt.getUTCDay()===4; // jueves = inicio de semana académica
    if(isWeekStart){
      headSvg.appendChild(svgEl("line",{ x1:x, y1:WEEK_BAND_TOP, x2:x, y2:HEADER_H, stroke:"#e2e8f0","stroke-width":1 }));
      const t = svgEl("text",{ x:x+3, y:Y_WEEK, "font-size":10, fill:"#64748b" });
      t.textContent = state.weekMode ? ("S"+(i/7+1)) : (dt.getUTCDate()+"/"+(dt.getUTCMonth()+1));
      headSvg.appendChild(t);
    }
  }
  // milestone markers — middle band
  MILESTONES.forEach(m => {
    const x = xLine(m.date);
    const isDel = m.type==="delivery";
    headSvg.appendChild(svgEl("line",{ x1:x, y1:22, x2:x, y2:HEADER_H, stroke:isDel?"#dc2626":"#cbd5e1","stroke-width":isDel?1.5:1, "stroke-dasharray":isDel?"none":"3 3" }));
    const t = svgEl("text",{ x:x+3, y:Y_MILE, "font-size":isDel?11:10, "font-weight":isDel?700:600, fill:isDel?"#dc2626":"#64748b" });
    t.textContent = m.label;
    headSvg.appendChild(t);
  });
  headSvg.appendChild(svgEl("line",{ x1:0, y1:HEADER_H-0.5, x2:W, y2:HEADER_H-0.5, stroke:"#e2e8f0" }));
}

/* ---------------- DOM refs ---------------- */
const labelsEl   = document.getElementById("labels");
const plotRows   = document.getElementById("plotRows");
const barsSvg    = document.getElementById("barsSvg");
const overlaySvg = document.getElementById("overlaySvg");

let barEls = {}; // id -> geometry (rebuilt each render)

/* ---------------- LAYOUT + RENDER ---------------- */
const COLLAPSED_H = 50; // taller rows when collapsed so the lane chips read clearly

// Lane geometry for a collapsed segment within a row of height rowH.
function laneGeom(rowH, dev){
  const pad = 5, gap = 4;
  const barH = Math.floor((rowH - pad*2 - gap) / 2);
  const top = pad + (dev === 1 ? 0 : barH + gap);
  return { barH, off: top };
}

function devVisible(t){ return state.showDev[t.dev]; }

function visibleRows(){
  const rows = []; let y = 0;
  groups.forEach(g => {
    const collapsed = !!state.collapsed[g.mod];
    const h = collapsed ? COLLAPSED_H : ROW_H;
    rows.push({ type:"group", g, y, h }); y += h;
    if(!collapsed){
      g.tasks.filter(devVisible).forEach(t => { rows.push({ type:"task", task:t, color:g.color, y, h:ROW_H }); y += ROW_H; });
    }
  });
  rows.totalHeight = y;
  return rows;
}

function drawTaskBar(parent, t, rowY, color, isSegment, rowH){
  const { x, w } = barGeom(t.start, t.end);
  let barH, barY, fontSize;
  if(isSegment){
    // collapsed: two lanes (D1 top, D2 bottom) — leveled schedule => no overlap within a lane
    const lg = laneGeom(rowH, t.dev);
    barH = lg.barH; barY = rowY + lg.off;
    fontSize = 11;
  } else {
    barH = 18; fontSize = 10;
    barY = rowY + (ROW_H - barH)/2;
  }
  const onCrit = state.showCrit && criticalSet.has(t.id);
  const g = svgEl("g", { class:"bar-g", "data-id":t.id, style:"cursor:pointer" });
  const rect = svgEl("rect", {
    x, y:barY, width:w, height:barH, rx: isSegment ? 4 : 5, ry: isSegment ? 4 : 5, fill:color,
    stroke: onCrit ? "#dc2626" : (t.dev===2 ? "#1e293b" : "rgba(0,0,0,0.18)"),
    "stroke-width": onCrit ? 2.6 : (t.dev===2 ? 1.6 : 1),
    "stroke-dasharray": (!onCrit && t.dev===2) ? "4 2.5" : "none",
    "fill-opacity": 0.9
  });
  g.appendChild(rect);
  // dev label always INSIDE the painted bar; hidden when the bar is too narrow to fit it
  if(w >= 18){
    const devTxt = svgEl("text", { x:x+5, y:barY+barH/2+3.6, "font-size":fontSize, "font-weight":700, fill:"#fff", "pointer-events":"none" });
    devTxt.textContent = "D" + t.dev;
    g.appendChild(devTxt);
  }
  g.addEventListener("mousemove", e => showTip(e, t));
  g.addEventListener("mouseleave", hideTip);
  g.addEventListener("click", () => toggleHighlight(t.id));
  parent.appendChild(g);
  barEls[t.id] = { g, rect, x, w, barY, barH, baseStroke: rect.getAttribute("stroke-width") };
}

function render(){
  buildHeader();
  const rows = visibleRows();
  const plotHeight = rows.totalHeight;
  const W = plotW();
  barEls = {};

  plotRows.style.width = W + "px";
  plotRows.style.height = plotHeight + "px";
  barsSvg.setAttribute("width", W);
  barsSvg.setAttribute("height", plotHeight);
  overlaySvg.setAttribute("width", W);
  overlaySvg.setAttribute("height", plotHeight);

  /* left labels */
  labelsEl.innerHTML = "";
  rows.forEach(r => {
    if(r.type === "group"){
      const g = r.g;
      const collapsed = !!state.collapsed[g.mod];
      const el = document.createElement("div");
      el.className = "grp-label";
      el.style.height = r.h + "px";
      el.innerHTML = `<span class="caret">${collapsed ? "▸" : "▾"}</span>
        <span class="dot" style="background:${g.color}"></span>
        <span class="gname">${g.mod}</span>
        <span class="count">${g.tasks.length} · ${g.totalHours.toFixed(1)} h</span>`;
      el.addEventListener("click", () => { state.collapsed[g.mod] = !state.collapsed[g.mod]; render(); });
      labelsEl.appendChild(el);
    } else {
      const t = r.task;
      const el = document.createElement("div");
      el.className = "task-label";
      el.dataset.id = t.id;
      const badge = t.spo ? `<span class="spo">${t.spo}</span>` : `<span class="spo">${t.hours.toFixed(1)} h</span>`;
      el.innerHTML = `<span class="idx">${t.id}</span><span class="nm">${t.name}</span>${badge}`;
      el.addEventListener("click", () => toggleHighlight(t.id));
      labelsEl.appendChild(el);
    }
  });

  /* row backgrounds */
  plotRows.innerHTML = "";
  rows.forEach(r => {
    const el = document.createElement("div");
    el.className = "row-line" + (r.type==="group" ? " grp" : "");
    el.style.height = r.h + "px";
    plotRows.appendChild(el);
  });

  /* bars svg layers */
  barsSvg.innerHTML = "";
  const gWeekend = svgEl("g",{}), gSprint = svgEl("g",{}), gGrid = svgEl("g",{}), gBars = svgEl("g",{}), gMile = svgEl("g",{});
  [gWeekend, gSprint, gGrid, gBars, gMile].forEach(x => barsSvg.appendChild(x));

  if(state.showWeekend && !state.weekMode){
    for(let i=0;i<totalDays;i++){
      const dt = new Date(rangeStart.getTime()+i*DAY_MS); const dow = dt.getUTCDay();
      if(dow===0 || dow===6) gWeekend.appendChild(svgEl("rect",{ x:i*DAY_W, y:0, width:DAY_W, height:plotHeight, fill:"rgba(15,23,42,0.035)" }));
    }
  }
  if(state.showSprints){
    SPRINTS.forEach((s, idx) => {
      const x1 = xLine(s.start), x2 = xLine(s.end);
      const fill = idx % 2 === 0 ? "rgba(99,102,241,0.04)" : "rgba(15,23,42,0.025)";
      gSprint.appendChild(svgEl("rect",{ x:x1, y:0, width:(x2-x1), height:plotHeight, fill }));
      gSprint.appendChild(svgEl("line",{ x1, y1:0, x2:x1, y2:plotHeight, stroke:"#cbd5e1","stroke-width":1,"stroke-dasharray":"2 3" }));
    });
  }
  // gridlines at week boundaries (thursdays = inicio de semana académica)
  for(let i=0;i<totalDays;i+=7){
    const x = state.weekMode ? (i/7)*WEEK_W : i*DAY_W;
    gGrid.appendChild(svgEl("line",{ x1:x, y1:0, x2:x, y2:plotHeight, stroke:"#eef2f7","stroke-width":1 }));
  }

  /* bars: task rows, or rolled-up segments on a collapsed group row */
  rows.forEach(r => {
    if(r.type === "task"){
      drawTaskBar(gBars, r.task, r.y, r.color, false);
    } else if(state.collapsed[r.g.mod]){
      const g = r.g, y = r.y, rowH = r.h;
      // two faint lane tracks (D1 top, D2 bottom) spanning the module envelope
      [1,2].forEach(dev => {
        if(!state.showDev[dev]) return;
        const ds = g.tasks.filter(t => t.dev === dev);
        if(!ds.length) return;
        const s = ds.reduce((m,t)=> parse(t.start) < parse(m) ? t.start : m, ds[0].start);
        const e = ds.reduce((m,t)=> parse(t.end)   > parse(m) ? t.end   : m, ds[0].end);
        const { x:lx, w:lw } = barGeom(s, e);
        const lg = laneGeom(rowH, dev);
        gBars.appendChild(svgEl("rect",{ x:lx, y:y + lg.off, width:lw, height:lg.barH, rx:4, ry:4, fill:g.color, "fill-opacity":0.12 }));
      });
      g.tasks.filter(devVisible).forEach(t => drawTaskBar(gBars, t, y, g.color, true, rowH));
    }
  });

  /* milestones + today */
  MILESTONES.forEach(m => {
    const x = xForDate(m.date); const isDel = m.type==="delivery";
    gMile.appendChild(svgEl("line",{ x1:x, y1:0, x2:x, y2:plotHeight,
      stroke:isDel?"#dc2626":"#94a3b8", "stroke-width":isDel?2:1, "stroke-dasharray":isDel?"none":"3 4" }));
  });
  if(parse(TODAY) >= rangeStart && parse(TODAY) <= rangeEnd){
    const x = xForDate(TODAY);
    gMile.appendChild(svgEl("line",{ x1:x, y1:0, x2:x, y2:plotHeight, stroke:"#16a34a","stroke-width":2 }));
  }

  buildOverlay();
  if(state.highlighted && barEls[state.highlighted]) applyHighlight(state.highlighted);
}

/* ---------------- OVERLAY: dependency arrows (orthogonal elbows) ---------------- */
function arrowPath(db, tb, from, to, stroke, sw, marker, op){
  const x1 = db.x + db.w, y1 = db.barY + db.barH/2;
  const x2 = tb.x,        y2 = tb.barY + tb.barH/2;
  const pad = 9;
  // out to the right of the source, vertical to the target row, then into the target's left edge
  const d = `M${x1},${y1} L${x1+pad},${y1} L${x1+pad},${y2} L${x2-1},${y2}`;
  return svgEl("path",{ d, fill:"none", stroke, "stroke-width":sw, "marker-end":marker, opacity:op,
    "stroke-linejoin":"round", "data-from":from, "data-to":to });
}

function buildOverlay(){
  overlaySvg.innerHTML = "";
  const defs = svgEl("defs",{});
  const m1 = svgEl("marker",{ id:"arrow", viewBox:"0 0 8 8", refX:7, refY:4, markerWidth:6, markerHeight:6, orient:"auto-start-reverse" });
  m1.appendChild(svgEl("path",{ d:"M0,0 L8,4 L0,8 z", fill:"#475569" }));
  defs.appendChild(m1);
  overlaySvg.appendChild(defs);
  const gArrows = svgEl("g",{ id:"arrows" });
  overlaySvg.appendChild(gArrows);

  if(!state.showDeps) return;
  TASKS.forEach(t => {
    const tb = barEls[t.id]; if(!tb) return;
    t.deps.forEach(dep => {
      const db = barEls[dep]; if(!db) return;
      const isCrit = criticalEdges.has(dep + ">" + t.id);
      const stroke = (state.showCrit && isCrit) ? "#dc2626" : "#94a3b8";
      gArrows.appendChild(arrowPath(db, tb, dep, t.id, stroke, isCrit?1.8:1.3, "url(#arrow)", isCrit?0.95:0.7));
    });
  });
}

/* ---------------- TOOLTIP ---------------- */
const tooltip = document.getElementById("tooltip");
function showTip(e, t){
  const depList = t.deps.length ? t.deps.join(", ") : "—";
  const critTag = criticalSet.has(t.id) ? ` <span class="crit-tag">◆ crítica</span>` : "";
  tooltip.innerHTML = `
    <h4>${t.id} · ${t.name}${critTag}</h4>
    <div style="color:${MOD_COLORS[t.mod]}">${t.mod}</div>
    <dl>
      <dt>Dev</dt><dd>D${t.dev}</dd>
      <dt>Inicio</dt><dd>${t.start}</dd>
      <dt>Fin</dt><dd>${t.end}</dd>
      <dt>Horas</dt><dd>${t.hours.toFixed(2)} h</dd>
      <dt>Deps</dt><dd>${depList}</dd>
    </dl>`;
  tooltip.style.opacity = "1";
  let x = e.clientX + 14, y = e.clientY + 14;
  const r = tooltip.getBoundingClientRect();
  if(x + r.width > window.innerWidth - 10) x = e.clientX - r.width - 14;
  if(y + r.height > window.innerHeight - 10) y = e.clientY - r.height - 14;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}
function hideTip(){ tooltip.style.opacity = "0"; }

/* ---------------- HIGHLIGHT PATH ---------------- */
function collectChain(id, dir, acc){
  const list = dir==="up" ? (taskById[id]?.deps || []) : (successors[id] || []);
  list.forEach(n => { if(!acc.has(n)){ acc.add(n); collectChain(n, dir, acc); } });
}
function applyHighlight(id){
  const set = new Set([id]);
  collectChain(id, "up", set);
  collectChain(id, "down", set);
  Object.entries(barEls).forEach(([tid, b]) => {
    const on = set.has(tid);
    b.g.style.opacity = on ? "1" : "0.18";
    b.rect.setAttribute("stroke-width", tid===id ? "2.6" : b.baseStroke);
  });
  document.querySelectorAll(".task-label").forEach(l => {
    l.classList.toggle("dim", l.dataset.id && !set.has(l.dataset.id));
  });
  overlaySvg.querySelectorAll("path[data-from]").forEach(p => {
    const on = set.has(p.dataset.from) && set.has(p.dataset.to);
    p.style.opacity = on ? "1" : "0.1";
  });
}
function toggleHighlight(id){
  if(state.highlighted === id){ clearHighlight(); return; }
  state.highlighted = id;
  applyHighlight(id);
}
function clearHighlight(){
  state.highlighted = null;
  Object.values(barEls).forEach(b => { b.g.style.opacity = "1"; b.rect.setAttribute("stroke-width", b.baseStroke); });
  document.querySelectorAll(".task-label").forEach(l => l.classList.remove("dim"));
  buildOverlay();
}

/* ---------------- CONTROLS ---------------- */
document.getElementById("tg-crit").addEventListener("change", e => { state.showCrit = e.target.checked; render(); });
document.getElementById("tg-deps").addEventListener("change", e => { state.showDeps = e.target.checked; buildOverlay(); if(state.highlighted) applyHighlight(state.highlighted); });
document.getElementById("tg-week").addEventListener("change", e => { state.weekMode = e.target.checked; document.getElementById("tg-weekend").disabled = state.weekMode; render(); });
document.getElementById("tg-weekend").addEventListener("change", e => { state.showWeekend = e.target.checked; render(); });
document.getElementById("tg-sprints").addEventListener("change", e => { state.showSprints = e.target.checked; render(); });
document.getElementById("tg-dev1").addEventListener("change", e => { state.showDev[1] = e.target.checked; render(); });
document.getElementById("tg-dev2").addEventListener("change", e => { state.showDev[2] = e.target.checked; render(); });
document.getElementById("btn-collapse").addEventListener("click", () => { groups.forEach(g => state.collapsed[g.mod] = true); render(); });
document.getElementById("btn-expand").addEventListener("click", () => { groups.forEach(g => state.collapsed[g.mod] = false); render(); });
document.getElementById("btn-clear").addEventListener("click", clearHighlight);

/* ---------------- LEGEND ---------------- */
const legendEl = document.getElementById("legend");
modOrder.forEach(mod => {
  if(!groups.find(g => g.mod===mod)) return;
  const item = document.createElement("span");
  item.className = "item";
  item.innerHTML = `<span class="swatch" style="background:${MOD_COLORS[mod]}"></span>${mod}`;
  legendEl.appendChild(item);
});
const devLeg = document.createElement("span");
devLeg.className = "item";
devLeg.innerHTML = `<span class="dev"><span class="devbar"></span>Dev 1</span>&nbsp;<span class="dev"><span class="devbar d2"></span>Dev 2</span>`;
legendEl.appendChild(devLeg);
const critLeg = document.createElement("span");
critLeg.className = "item";
critLeg.innerHTML = `<span class="crit-box"></span>Camino crítico`;
legendEl.appendChild(critLeg);

/* ---------------- EXPORT PNG ---------------- */
document.getElementById("btn-png").addEventListener("click", () => {
  if(window.html2canvas){ doExport(); return; }
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
  s.onload = doExport;
  s.onerror = () => alert("No se pudo cargar html2canvas (sin internet). Usá imprimir → PDF en su lugar.");
  document.head.appendChild(s);
});
function doExport(){
  const target = document.getElementById("grid");
  html2canvas(target, { backgroundColor:"#ffffff", scale:2, windowWidth: target.scrollWidth }).then(canvas => {
    const a = document.createElement("a");
    a.download = "SportMatch-Gantt-Devs.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });
}

/* ---------------- INIT ---------------- */
render();
</script>
</body>
