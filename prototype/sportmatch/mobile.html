<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="app/support.js"></script>
<script>
  if (new URLSearchParams(window.location.search).get('frame') === '1') {
    document.documentElement.classList.add('force-device-frame');
  }
</script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="design-system/tokens/fonts.css">
  <link rel="stylesheet" href="design-system/tokens/colors.css">
  <link rel="stylesheet" href="design-system/tokens/typography.css">
  <link rel="stylesheet" href="design-system/tokens/spacing.css">
  <link rel="stylesheet" href="design-system/tokens/effects.css">
  <link rel="stylesheet" href="design-system/tokens/base.css">
  <link rel="stylesheet" href="design-system/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="design-system/bundle.js"></script>
  <script src="app/photo-data.js"></script>
  <script src="app/overrides.js"></script>
  <style>
    html, body { position: relative; width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    x-dc, #dc-root, #dc-root > .sc-host {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Responsive stage: full-bleed native app on phones, framed device on desktop. */
    .sm-stage {
      position: absolute; inset: 0; width: 100%; height: 100%; overflow: auto;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 0%, #14181f 0%, #05060a 60%, #000 100%);
    }
    .sm-device-frame {
      position: relative; flex: 1;
      width: 100%; height: 100%;
      min-width: 0;
    }
    .sm-device {
      position: relative; flex: none;
      width: 100%; height: 100vh; height: 100dvh;
      background: #000; overflow: hidden;
    }
    /* Tablet / desktop — present as a real device on the dark backdrop. */
    @media (min-width: 760px) {
      .sm-stage { padding: 16px; overflow: hidden; }
      .sm-device-frame {
        position: relative;
        flex: none;
        margin: auto;
      }
      .sm-device {
        position: absolute;
        width: 390px;
        height: 844px;
        border-radius: 54px;
        box-shadow: 0 0 0 11px #15171c, 0 0 0 13px #2a2d34, 0 50px 120px rgba(0,0,0,0.7);
        transform-origin: top left;
      }
    }
    html.force-device-frame .sm-stage { padding: 0; overflow: hidden; }
    html.force-device-frame .sm-device-frame {
      position: relative;
      flex: none;
      margin: auto;
      width: 416px;
      height: 870px;
    }
    html.force-device-frame .sm-device {
      position: absolute;
      left: 13px;
      top: 13px;
      width: 390px;
      height: 844px;
      border-radius: 54px;
      box-shadow: 0 0 0 11px #15171c, 0 0 0 13px #2a2d34, 0 50px 120px rgba(0,0,0,0.7);
      transform-origin: top left;
    }
    /* Leaflet panes must sit under the glass chrome. */
    .sm-device .leaflet-container { background: #0a0d12; font-family: var(--font-text); }
  </style>
</helmet>
<div class="sm-stage">
  <div class="sm-device-frame">
    <div class="sm-device">
      <x-import component="SportMatchApp" from="app/SportMatchApp.jsx" hint-size="100%,100%" style="position:absolute; inset:0; width:100%; height:100%"></x-import>
    </div>
  </div>
</div>
<script>
  (function () {
    var frame = document.querySelector('.sm-device-frame');
    var device = document.querySelector('.sm-device');
    var desktop = window.matchMedia('(min-width: 760px)');
    var forceFrame = document.documentElement.classList.contains('force-device-frame');

    function fitDevice() {
      if (!frame || !device) return;
      if (forceFrame) {
        frame.style.width = '416px';
        frame.style.height = '870px';
        device.style.position = 'absolute';
        device.style.left = '13px';
        device.style.top = '13px';
        device.style.transform = 'none';
        return;
      }
      if (!forceFrame && !desktop.matches) {
        frame.style.width = '';
        frame.style.height = '';
        device.style.position = '';
        device.style.left = '';
        device.style.top = '';
        device.style.transform = '';
        return;
      }

      var frameWidth = 416;
      var frameHeight = 870;
      var edgeInset = 13;
      var maxDesktopScale = forceFrame ? 0.86 : 0.9;
      var breathingRoom = forceFrame ? 96 : 64;
      var viewportHeight = window.innerHeight;
      if (document.documentElement && document.documentElement.clientHeight) {
        viewportHeight = Math.min(viewportHeight, document.documentElement.clientHeight);
      }
      if (window.visualViewport && window.visualViewport.height) {
        viewportHeight = Math.min(viewportHeight, window.visualViewport.height);
      }
      var availableWidth = Math.max(0, window.innerWidth - breathingRoom);
      var availableHeight = Math.max(0, viewportHeight - breathingRoom);
      var scale = Math.min(maxDesktopScale, availableWidth / frameWidth, availableHeight / frameHeight);

      frame.style.width = (frameWidth * scale).toFixed(2) + 'px';
      frame.style.height = (frameHeight * scale).toFixed(2) + 'px';
      device.style.left = (edgeInset * scale).toFixed(2) + 'px';
      device.style.top = (edgeInset * scale).toFixed(2) + 'px';
      device.style.transform = 'scale(' + scale.toFixed(3) + ')';
    }

    window.addEventListener('resize', fitDevice);
    window.addEventListener('load', fitDevice);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitDevice);
    if (desktop.addEventListener) desktop.addEventListener('change', fitDevice);
    fitDevice();
  })();
</script>
</x-dc>
</body>
</html>
