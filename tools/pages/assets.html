<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportMatch — Assets</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo-mark.svg">
<style>
  :root {
    --bg: #f6f8fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #667085;
    --line: #d8e0ec;
    --brand: #0270c2;
    --brand-soft: #e5f3ff;
    --green: #1f8f6a;
    --shadow: 0 14px 34px rgba(22, 37, 67, 0.10);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(180deg, #eef6ff 0, rgba(238, 246, 255, 0) 280px),
      var(--bg);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .page {
    width: min(1180px, calc(100% - 36px));
    margin: 0 auto;
    padding: 30px 0 46px;
  }

  .eyebrow {
    color: var(--brand);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 { margin: 0; font-size: 32px; line-height: 1.08; }

  .summary {
    max-width: 700px;
    margin: 10px 0 22px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
  }

  .summary code {
    font-family: var(--mono);
    font-size: 13px;
    background: #eaf1fa;
    border-radius: 5px;
    padding: 1px 5px;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .search {
    position: relative;
    flex: 1 1 260px;
    min-width: 0;
  }

  .search svg {
    position: absolute;
    left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .search input {
    width: 100%;
    height: 38px;
    padding: 0 12px 0 34px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    outline: none;
  }

  .search input:focus { border-color: rgba(2,112,194,.55); box-shadow: 0 0 0 3px rgba(2,112,194,.12); }

  .seg {
    display: inline-flex;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    gap: 2px;
  }

  .seg button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 11px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .seg button.on { background: var(--brand-soft); color: #075985; }

  /* ---------- explorer shell ---------- */
  .explorer {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }

  .tree, .files {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: 0 1px 0 rgba(16, 24, 40, .03);
  }

  .tree { padding: 8px; position: sticky; top: 16px; }

  .tree-label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 8px 9px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }

  .tree-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 8px 9px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }

  .tree-item:hover { background: #f2f6fb; }
  .tree-item.on { background: var(--brand-soft); color: #075985; }
  .tree-item .ti-icon { flex: 0 0 auto; color: var(--brand); opacity: .85; }
  .tree-item .ti-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tree-item .ti-count {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }

  .tree-item.on .ti-count { color: #075985; }

  .tree-foot {
    margin-top: 6px;
    padding: 10px 9px 6px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.5;
  }

  .tree-foot b { color: var(--ink); font-family: var(--mono); font-size: 11.5px; }

  /* ---------- file pane ---------- */
  .files-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }

  .crumbs {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  .crumbs .sep, .crumbs .dim { color: var(--muted); font-weight: 500; }

  .files-note {
    margin: 7px 0 0;
    max-width: 660px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
  }

  .count {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .05em;
    text-align: right;
    padding-top: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 10px;
    padding: 14px;
  }

  .grid.photos-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }

  .file {
    display: flex;
    flex-direction: column;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    cursor: pointer;
    overflow: hidden;
    text-align: left;
    font: inherit;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }

  .file:hover { transform: translateY(-2px); border-color: rgba(2,112,194,.35); box-shadow: var(--shadow); }
  .file.on { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(2,112,194,.16); }

  .thumb {
    display: grid;
    place-items: center;
    height: 92px;
    background: #f7f9fc;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    overflow: hidden;
  }

  .thumb.dark { background: #0b0b0e; color: #fff; }
  .thumb svg { width: 26px; height: 26px; }
  .thumb .brand-svg svg, .thumb .brand-svg { width: 54px; height: 54px; }
  .photos-grid .thumb { height: 132px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .thumb .ext-chip {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--brand);
    background: var(--brand-soft);
    border: 1px solid rgba(2,112,194,.16);
    border-radius: 7px;
    padding: 7px 10px;
  }

  .file-meta { padding: 9px 10px 10px; min-width: 0; }

  .file-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-sub { margin-top: 3px; color: var(--muted); font-size: 11px; font-family: var(--mono); }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }

  .group-label {
    grid-column: 1 / -1;
    margin: 4px 0 -2px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  /* ---------- detail drawer ---------- */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .38);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
    z-index: 20;
  }

  .scrim.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0; right: 0;
    width: min(720px, 94vw);
    height: 100%;
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -18px 0 44px rgba(22, 37, 67, .16);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1);
    z-index: 21;
    display: flex;
    flex-direction: column;
  }

  .drawer.open { transform: none; }

  .drawer-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--line);
  }

  .drawer-title { min-width: 0; flex: 1; }

  .drawer-title h3 {
    margin: 0;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .drawer-path {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11.5px;
    overflow-wrap: anywhere;
  }

  .icon-btn {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 30px; height: 30px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
  }

  .icon-btn:hover { color: var(--ink); border-color: rgba(2,112,194,.35); }

  .drawer-body { flex: 1; overflow: auto; padding: 16px; }

  .preview {
    display: grid;
    place-items: center;
    min-height: 168px;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #f7f9fc;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .preview.dark { background: #0b0b0e; border-color: #1c1c22; color: #fff; }
  .preview img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; }
  .preview .icon-xl svg { width: 72px; height: 72px; }
  .preview .brand-xl svg { width: 120px; height: 120px; }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; width: 100%; }

  .swatch { border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
  .swatch .chip { height: 34px; background-image: linear-gradient(45deg,#e6ebf2 25%,transparent 25%),linear-gradient(-45deg,#e6ebf2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6ebf2 75%),linear-gradient(-45deg,transparent 75%,#e6ebf2 75%); background-size: 10px 10px; background-position: 0 0,0 5px,5px -5px,-5px 0; }
  .swatch .chip i { display: block; height: 100%; }
  .swatch .sw-name { padding: 5px 6px 6px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .meta-rows { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }

  .meta-row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 9px 12px;
    font-size: 12.5px;
    border-bottom: 1px solid var(--line);
  }

  .meta-row:last-child { border-bottom: none; }
  .meta-row dt { color: var(--muted); font-weight: 600; }
  .meta-row dd { margin: 0; font-family: var(--mono); font-size: 12px; text-align: right; overflow-wrap: anywhere; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 36px;
    padding: 0 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
  }

  .btn:hover { border-color: rgba(2,112,194,.4); color: var(--brand); }
  .btn.primary { background: #102033; border-color: #102033; color: #fff; }
  .btn.primary:hover { background: var(--brand); border-color: var(--brand); color: #fff; }

  .code {
    margin: 0;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #0f172a;
    color: #cbd5e1;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    overflow: auto;
    max-height: 340px;
    white-space: pre;
  }

  .code-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 12px);
    padding: 9px 15px;
    border-radius: 8px;
    background: #102033;
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 40;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- list view ---------- */
  .list { padding: 6px 0 8px; }

  .row {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) 96px 108px;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 9px 16px;
    border: none;
    border-bottom: 1px solid #eef2f7;
    background: transparent;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .row:hover { background: #f7f9fc; }
  .row.on { background: var(--brand-soft); }
  .row-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; background: #f2f6fb; color: var(--brand); overflow: hidden; }
  .row-icon svg { width: 17px; height: 17px; }
  .row-icon img { width: 100%; height: 100%; object-fit: cover; }
  .row-name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-kind, .row-size { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .row-size { text-align: right; }
  .list .group-label { padding: 12px 16px 6px; margin: 0; }

  @media (max-width: 860px) {
    .explorer { grid-template-columns: 1fr; }
    .tree { position: static; }
    .row { grid-template-columns: 30px minmax(0, 1fr) 92px; }
    .row-kind { display: none; }
  }

  @media (max-width: 720px) {
    .page { width: min(100% - 24px, 1180px); padding-top: 22px; }
    h1 { font-size: 27px; }
    .files-head { flex-direction: column; }
    .count { text-align: left; }
  }
</style>
</head>
<body>

<div class="page">
  <p class="eyebrow">Design System</p>
  <h1>Assets</h1>
  <p class="summary">
    Todo lo exportable del rediseño de la app, navegable como un filesystem.
    Los archivos se sirven tal cual desde <code>/assets</code>: click en cualquiera para
    previsualizar, copiar la ruta o el código, y descargar.
  </p>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="q" type="search" placeholder="Buscar archivo… (icons, .css, football)" autocomplete="off" spellcheck="false">
    </div>
    <div class="seg" id="view-toggle">
      <button data-view="grid" class="on">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
        Grid
      </button>
      <button data-view="list">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>
        Lista
      </button>
    </div>
  </div>

  <div class="explorer">
    <aside class="tree">
      <div class="tree-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
        assets/
      </div>
      <nav id="tree-nav"></nav>
      <div class="tree-foot" id="tree-foot"></div>
    </aside>

    <section class="files">
      <div class="files-head">
        <div>
          <div class="crumbs" id="crumbs"></div>
          <p class="files-note" id="files-note"></p>
        </div>
        <div class="count" id="files-count"></div>
      </div>
      <div id="files-body"></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">
      <h3 id="d-name"></h3>
      <span class="drawer-path" id="d-path"></span>
    </div>
    <button class="icon-btn" id="d-close" aria-label="Cerrar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<div class="toast" id="toast"></div>

<script>

 "root": "assets",

    {
     "name": "chevron-down.svg",
     "path": "/assets/icons/chevron-down.svg",

  {
   "name": "tokens",
   "label": "Tokens",
   "note": "CSS con todas las variables (color, tipografía, espaciado, radios, sombras, blur, easings). styles.css es el entry point.",
   "files": [
    {
     "name": "base.css",
     "path": "/assets/tokens/base.css",
     "ext": "css",
     "size": 1078,
     "text": "/* ============================================================\n   SportMatch — Base layer\n   Minimal resets + the default dark canvas. Consumers get a\n   true-black, white-ink, Inter-by-default surface for free.\n   ============================================================ */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  text-size-adjust: 100%;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg-base);\n  color: var(--text-primary);\n  font: var(--text-body);\n  letter-spacing: var(--tracking-normal);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, p, figure {\n  margin: 0;\n}\n\nbutton {\n  font-family: inherit;\n  cursor: pointer;\n}\n\nimg {\n  display: block;\n  max-width: 100%;\n}\n\n/* Tabular, heavy numerals wherever a stat is shown */\n.sm-tabular {\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: 'tnum' 1;\n}\n\n/* Selection picks up the brand accent */\n::selection {\n  background: var(--accent);\n  color: var(--accent-ink);\n}\n",
     "vars": 0
    },
    {
     "name": "colors.css",
     "path": "/assets/tokens/colors.css",
     "ext": "css",
     "size": 2831,
     "text": "/* ============================================================\n   SportMatch — Color System\n   Dark-first. Pure black canvas, white ink, frosted glass\n   surfaces, one electric-blue accent. Color is rationed:\n   photography carries the energy, UI stays monochrome + glass.\n   ============================================================ */\n\n:root {\n  /* ---- Base ---- */\n  --color-black: #000000;\n  --color-white: #ffffff;\n\n  /* ---- Canvas / backdrops ---- */\n  --bg-base: #000000;        /* the app canvas — always true black   */\n  --bg-raised: #0b0b0e;      /* sheets / modals over a dimmed canvas  */\n  --bg-sunken: #060608;      /* map shells, media wells               */\n  --scrim: rgba(0, 0, 0, 0.55);   /* dim behind sheets & modals       */\n\n  /* ---- Ink (white text & icons over dark) ---- */\n  --ink-100: rgba(255, 255, 255, 1);\n  --ink-80:  rgba(255, 255, 255, 0.80);\n  --ink-64:  rgba(255, 255, 255, 0.64);\n  --ink-46:  rgba(255, 255, 255, 0.46);\n  --ink-32:  rgba(255, 255, 255, 0.32);\n  --ink-16:  rgba(255, 255, 255, 0.16);\n\n  /* ---- Glass surfaces (frosted, sit on photography) ---- */\n  --glass-thin:    rgba(255, 255, 255, 0.03);\n  --glass:         rgba(255, 255, 255, 0.05);\n  --glass-strong:  rgba(255, 255, 255, 0.10);\n  --glass-solid:   rgba(22, 22, 26, 0.60);   /* sheets where legibility wins */\n  --glass-border:        rgba(255, 255, 255, 0.15);\n  --glass-border-strong: rgba(255, 255, 255, 0.26);\n  --glass-highlight:     rgba(255, 255, 255, 0.40); /* top hairline sheen */\n\n  /* ---- Accent — Electric Blue ---- */\n  --accent:        #4ea8ff;\n  --accent-bright: #7cc0ff;\n  --accent-deep:   #2c84e0;\n  --accent-ink:    #001226;               /* text on a solid accent fill */\n  --accent-tint:   rgba(78, 168, 255, 0.16);\n  --accent-glow:   rgba(78, 168, 255, 0.45);\n\n  /* ---- Semantic ---- */\n  --success:  #66d575;\n  --success-tint: rgba(102, 213, 117, 0.16);\n  --warning:  #ffcb57;\n  --danger:   #ff5a5f;\n  --danger-tint: rgba(255, 90, 95, 0.16);\n\n  /* ---- Swipe affordances ---- */\n  --swipe-yes:  #66d575;   /* interested → right */\n  --swipe-no:   #ff5a6a;   /* skip → left        */\n  --swipe-info: #4ea8ff;   /* details → up/tap   */\n\n  /* ============================================================\n     Semantic aliases — reference these in components\n     ============================================================ */\n  --text-primary:   var(--ink-100);\n  --text-secondary: var(--ink-64);\n  --text-tertiary:  var(--ink-46);\n  --text-disabled:  var(--ink-32);\n  --text-on-accent: var(--color-white);\n\n  --surface-glass:        var(--glass);\n  --surface-glass-strong: var(--glass-strong);\n  --surface-sheet:        var(--glass-solid);\n  --border-hairline:      var(--glass-border);\n  --border-emphasis:      var(--glass-border-strong);\n\n  --focus-ring: var(--accent);\n}\n",
     "vars": 44
    },
    {
     "name": "effects.css",
     "path": "/assets/tokens/effects.css",

const KIND = {
  svg:  { label: 'SVG',  kind: 'Vector' },
  jpg:  { label: 'JPG',  kind: 'Imagen' },
  jpeg: { label: 'JPG',  kind: 'Imagen' },
  png:  { label: 'PNG',  kind: 'Imagen' },
  css:  { label: 'CSS',  kind: 'Hoja de estilos' },
  md:   { label: 'MD',   kind: 'Texto' }
};

const FOLDER_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>';
const ALL_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"></path></svg>';
const CSS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 15-3 3 3 3M15 15l3 3-3 3"></path><path d="M14 3H7a2 2 0 0 0-2 2v7M19 12V8.5L13.5 3H14Z"></path></svg>';

const ALL_FILES = MANIFEST.folders.flatMap(f => f.files.map(x => ({ ...x, folder: f.name })));
const TOTAL_BYTES = ALL_FILES.reduce((s, f) => s + f.size, 0);

let current = MANIFEST.folders[0].name;
let view = 'grid';
let query = '';
let selected = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function bytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function folderOf(name) { return MANIFEST.folders.find(f => f.name === name); }

function visibleFiles() {
  const q = query.trim().toLowerCase();
  if (q) return ALL_FILES.filter(f => (f.folder + '/' + f.name).toLowerCase().includes(q));
  const f = folderOf(current);
  return f ? f.files.map(x => ({ ...x, folder: current })) : ALL_FILES;
}

/* ---------- thumbs ---------- */
function thumbFor(file) {
  if (file.ext === 'svg') {
    const cls = file.folder === 'brand' ? 'brand-svg' : '';
    return `<div class="thumb"><span class="${cls}">${file.svg}</span></div>`;
  }
  if (file.ext === 'css') {
    return `<div class="thumb"><span class="ext-chip">CSS</span></div>`;
  }
  return `<div class="thumb"><img src="${file.path}" alt="${esc(file.name)}" loading="lazy" decoding="async"></div>`;
}

function subFor(file) {
  if (file.w) return file.w + '×' + file.h + ' · ' + bytes(file.size);
  if (file.ext === 'css') return (file.vars ? file.vars + ' vars · ' : '') + bytes(file.size);
  return bytes(file.size);
}

/* ---------- render ---------- */
function renderTree() {
  const nav = $('tree-nav');
  const rows = MANIFEST.folders.map(f => `
    <button class="tree-item ${!query && f.name === current ? 'on' : ''}" data-folder="${f.name}">
      <span class="ti-icon">${FOLDER_ICON}</span>
      <span class="ti-name">${f.name}/</span>
      <span class="ti-count">${f.files.length}</span>
    </button>`).join('');

  nav.innerHTML = `
    <button class="tree-item ${query || current === '__all__' ? 'on' : ''}" data-folder="__all__">
      <span class="ti-icon">${ALL_ICON}</span>
      <span class="ti-name">Todos los archivos</span>
      <span class="ti-count">${ALL_FILES.length}</span>
    </button>
    ${rows}`;

  nav.querySelectorAll('.tree-item').forEach(btn => {
    btn.addEventListener('click', () => {
      current = btn.dataset.folder;
      query = '';
      $('q').value = '';
      render();
    });
  });

  $('tree-foot').innerHTML =
    `<b>${ALL_FILES.length}</b> archivos · <b>${bytes(TOTAL_BYTES)}</b><br>Inter Tight + Inter (Google Fonts)`;
}

function renderFiles() {
  const searching = query.trim().length > 0;
  const showingAll = current === '__all__' || searching;
  const files = showingAll
    ? (searching ? visibleFiles() : ALL_FILES)
    : visibleFiles();

  const f = showingAll ? null : folderOf(current);

  $('crumbs').innerHTML = showingAll
    ? `assets<span class="sep">/</span><span class="dim">${searching ? 'búsqueda: ' + esc(query.trim()) : 'todos'}</span>`
    : `assets<span class="sep">/</span>${f.name}<span class="sep">/</span>`;

  $('files-note').textContent = showingAll
    ? (searching ? 'Resultados en todas las carpetas.' : 'Todo el contenido del export, agrupado por carpeta.')
    : f.note;

  const totalBytes = files.reduce((s, x) => s + x.size, 0);
  $('files-count').textContent = `${files.length} archivo${files.length === 1 ? '' : 's'} · ${bytes(totalBytes)}`;

  const body = $('files-body');

  if (!files.length) {
    body.innerHTML = `<div class="empty">Sin resultados para “${esc(query.trim())}”.</div>`;
    return;
  }

  const groups = showingAll
    ? MANIFEST.folders
        .map(fo => [fo.name, files.filter(x => x.folder === fo.name)])
        .filter(([, list]) => list.length)
    : [[current, files]];

  if (view === 'grid') {
    body.innerHTML = groups.map(([name, list]) => `
      <div class="grid ${name === 'photos' ? 'photos-grid' : ''}">
        ${showingAll ? `<div class="group-label">${name}/</div>` : ''}
        ${list.map(file => `
          <button class="file ${selected && selected.path === file.path ? 'on' : ''}" data-path="${file.path}">
            ${thumbFor(file)}
            <span class="file-meta">
              <span class="file-name">${esc(file.name)}</span>
              <span class="file-sub">${subFor(file)}</span>
            </span>
          </button>`).join('')}
      </div>`).join('');
  } else {
    body.innerHTML = `<div class="list">${groups.map(([name, list]) => `
      ${showingAll ? `<div class="group-label">${name}/</div>` : ''}
      ${list.map(file => `
        <button class="row ${selected && selected.path === file.path ? 'on' : ''}" data-path="${file.path}">
          <span class="row-icon">${
            file.ext === 'svg' ? file.svg
            : file.ext === 'css' ? CSS_ICON
            : `<img src="${file.path}" alt="" loading="lazy" decoding="async">`}</span>
          <span class="row-name">${esc(file.name)}</span>
          <span class="row-kind">${(KIND[file.ext] || {}).kind || file.ext}</span>
          <span class="row-size">${subFor(file)}</span>
        </button>`).join('')}`).join('')}</div>`;
  }

  body.querySelectorAll('[data-path]').forEach(el => {
    el.addEventListener('click', () => openFile(el.dataset.path));
  });
}

function render() { renderTree(); renderFiles(); }

/* ---------- drawer ---------- */
function swatchesFrom(css) {
  const out = [];
  const re = /--([\w-]+)\s*:\s*(#[0-9a-fA-F]{3,8}|rgba?\([^)]*\))\s*;/g;
  let m;
  while ((m = re.exec(css)) && out.length < 60) out.push([m[1], m[2]]);
  return out;
}

function openFile(path) {
  const file = ALL_FILES.find(x => x.path === path);
  if (!file) return;
  selected = file;

  $('d-name').textContent = file.name;
  $('d-path').textContent = '/' + file.path;

  let preview = '';
  if (file.ext === 'svg') {
    preview = file.folder === 'brand'
      ? `<div class="preview dark"><span class="brand-xl">${file.svg}</span></div>`
      : `<div class="preview"><span class="icon-xl">${file.svg}</span></div>`;
  } else if (file.ext === 'css') {
    const sw = swatchesFrom(file.text || '');
    preview = sw.length
      ? `<div class="preview"><div class="swatches">${sw.map(([n, v]) =>
          `<div class="swatch"><div class="chip"><i style="background:${v}"></i></div><div class="sw-name" title="--${n}">--${esc(n)}</div></div>`).join('')}</div></div>`
      : '';
  } else {
    preview = `<div class="preview dark"><img src="${file.path}" alt="${esc(file.name)}"></div>`;
  }

  const meta = [
    ['Carpeta', file.folder + '/'],
    ['Tipo', (KIND[file.ext] || {}).label || file.ext.toUpperCase()],
    file.w ? ['Dimensiones', file.w + ' × ' + file.h + ' px'] : null,
    file.ext === 'svg' ? ['Dimensiones', '24 × 24 (viewBox)'] : null,
    file.vars ? ['Variables', file.vars] : null,
    ['Peso', bytes(file.size)]
  ].filter(Boolean);

  const code = file.ext === 'svg' ? file.svg : (file.ext === 'css' ? file.text : null);

  $('d-body').innerHTML = `
    ${preview}
    <dl class="meta-rows">
      ${meta.map(([k, v]) => `<div class="meta-row"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}
    </dl>
    <div class="actions">
      <a class="btn primary" href="${file.path}" download="${esc(file.name)}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"></path></svg>
        Descargar
      </a>
      <a class="btn" href="${file.path}" target="_blank" rel="noopener">Abrir</a>
      <button class="btn" data-copy="path">Copiar ruta</button>
      ${code ? `<button class="btn" data-copy="code">Copiar ${file.ext === 'svg' ? 'SVG' : 'CSS'}</button>` : ''}
    </div>
    ${code ? `
      <div class="code-label"><span>${file.ext === 'svg' ? 'Source' : 'Contenido'}</span><span>${file.name}</span></div>
      <pre class="code">${esc(code)}</pre>` : ''}
  `;

  $('d-body').querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.dataset.copy === 'path' ? '/' + file.path : code;
      copy(text, btn.dataset.copy === 'path' ? 'Ruta copiada' : 'Código copiado');
    });
  });

  $('drawer').classList.add('open');
  $('drawer').setAttribute('aria-hidden', 'false');
  $('scrim').classList.add('open');
  renderFiles();
}

function closeDrawer() {
  $('drawer').classList.remove('open');
  $('drawer').setAttribute('aria-hidden', 'true');
  $('scrim').classList.remove('open');
  selected = null;
  renderFiles();
}

function copy(text, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('No se pudo copiar'); }
  ta.remove();
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- events ---------- */
$('q').addEventListener('input', e => { query = e.target.value; render(); });
$('scrim').addEventListener('click', closeDrawer);
$('d-close').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

$('view-toggle').querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    view = btn.dataset.view;
    $('view-toggle').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
    renderFiles();
  });
});

render();
</script>
