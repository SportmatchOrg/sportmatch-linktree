<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportMatch — Assets</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo-mark.svg">
<style>
  :root {
    --bg: #f6f8fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #667085;
    --line: #d8e0ec;
    --brand: #0270c2;
    --brand-soft: #e5f3ff;
    --green: #1f8f6a;
    --shadow: 0 14px 34px rgba(22, 37, 67, 0.10);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(180deg, #eef6ff 0, rgba(238, 246, 255, 0) 280px),
      var(--bg);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .page {
    width: min(1180px, calc(100% - 36px));
    margin: 0 auto;
    padding: 30px 0 46px;
  }

  .eyebrow {
    color: var(--brand);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 { margin: 0; font-size: 32px; line-height: 1.08; }

  .summary {
    max-width: 700px;
    margin: 10px 0 22px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
  }

  .summary code {
    font-family: var(--mono);
    font-size: 13px;
    background: #eaf1fa;
    border-radius: 5px;
    padding: 1px 5px;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .search {
    position: relative;
    flex: 1 1 260px;
    min-width: 0;
  }

  .search svg {
    position: absolute;
    left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .search input {
    width: 100%;
    height: 38px;
    padding: 0 12px 0 34px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    outline: none;
  }

  .search input:focus { border-color: rgba(2,112,194,.55); box-shadow: 0 0 0 3px rgba(2,112,194,.12); }

  .seg {
    display: inline-flex;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    gap: 2px;
  }

  .seg button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 11px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .seg button.on { background: var(--brand-soft); color: #075985; }

  /* ---------- explorer shell ---------- */
  .explorer {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }

  .tree, .files {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: 0 1px 0 rgba(16, 24, 40, .03);
  }

  .tree { padding: 8px; position: sticky; top: 16px; }

  .tree-label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 8px 9px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }

  .tree-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 8px 9px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }

  .tree-item:hover { background: #f2f6fb; }
  .tree-item.on { background: var(--brand-soft); color: #075985; }
  .tree-item .ti-icon { flex: 0 0 auto; color: var(--brand); opacity: .85; }
  .tree-item .ti-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tree-item .ti-count {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }

  .tree-item.on .ti-count { color: #075985; }

  .tree-foot {
    margin-top: 6px;
    padding: 10px 9px 6px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.5;
  }

  .tree-foot b { color: var(--ink); font-family: var(--mono); font-size: 11.5px; }

  /* ---------- file pane ---------- */
  .files-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }

  .crumbs {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  .crumbs .sep, .crumbs .dim { color: var(--muted); font-weight: 500; }

  .files-note {
    margin: 7px 0 0;
    max-width: 660px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
  }

  .count {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .05em;
    text-align: right;
    padding-top: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 10px;
    padding: 14px;
  }

  .grid.photos-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }

  .file {
    display: flex;
    flex-direction: column;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    cursor: pointer;
    overflow: hidden;
    text-align: left;
    font: inherit;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }

  .file:hover { transform: translateY(-2px); border-color: rgba(2,112,194,.35); box-shadow: var(--shadow); }
  .file.on { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(2,112,194,.16); }

  .thumb {
    display: grid;
    place-items: center;
    height: 92px;
    background: #f7f9fc;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    overflow: hidden;
  }

  .thumb.dark { background: #0b0b0e; color: #fff; }
  .thumb svg { width: 26px; height: 26px; }
  .thumb .brand-svg svg, .thumb .brand-svg { width: 54px; height: 54px; }
  .photos-grid .thumb { height: 132px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .thumb .ext-chip {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--brand);
    background: var(--brand-soft);
    border: 1px solid rgba(2,112,194,.16);
    border-radius: 7px;
    padding: 7px 10px;
  }

  .file-meta { padding: 9px 10px 10px; min-width: 0; }

  .file-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-sub { margin-top: 3px; color: var(--muted); font-size: 11px; font-family: var(--mono); }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }

  .group-label {
    grid-column: 1 / -1;
    margin: 4px 0 -2px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  /* ---------- DESIGN.md doc view ---------- */
  .doc { max-width: 78ch; padding: 4px 2px 28px; color: var(--ink); font-size: 14px; line-height: 1.65; }
  .doc h1, .doc h2, .doc h3, .doc h4 { line-height: 1.25; font-weight: 800; }
  .doc h1 { margin: 6px 0 14px; font-size: 23px; letter-spacing: -0.02em; }
  .doc h2 { margin: 30px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 17.5px; letter-spacing: -0.01em; }
  .doc h3 { margin: 22px 0 7px; font-size: 14.5px; }
  .doc h4 { margin: 18px 0 6px; font-size: 13.5px; color: var(--muted); }
  .doc p { margin: 0 0 11px; }
  .doc ul, .doc ol { margin: 0 0 12px; padding-left: 20px; }
  .doc li { margin: 0 0 4px; }
  .doc a { color: var(--brand); }
  .doc hr { margin: 22px 0; border: 0; border-top: 1px solid var(--line); }
  .doc strong { font-weight: 700; }
  .doc code {
    padding: 1.5px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: #f4f7fb;
    font-family: var(--mono);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .doc-code {
    margin: 0 0 14px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #0f172a;
    color: #cbd5e1;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    overflow-x: auto;
  }
  .doc-code code { padding: 0; border: 0; background: none; color: inherit; font-size: inherit; }
  .doc-tablewrap { margin: 0 0 16px; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  .doc-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .doc-table th, .doc-table td { padding: 7px 11px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  .doc-table th { background: #f4f7fb; font-weight: 800; white-space: nowrap; }
  .doc-table tr:last-child td { border-bottom: none; }
  .doc-table code { font-size: 11.5px; }

  .tree-item.doc-item .ti-count { font-size: 10.5px; }

  /* ---------- detail drawer ---------- */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .38);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
    z-index: 20;
  }

  .scrim.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0; right: 0;
    width: min(720px, 94vw);
    height: 100%;
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -18px 0 44px rgba(22, 37, 67, .16);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1);
    z-index: 21;
    display: flex;
    flex-direction: column;
  }

  .drawer.open { transform: none; }

  .drawer-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--line);
  }

  .drawer-title { min-width: 0; flex: 1; }

  .drawer-title h3 {
    margin: 0;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .drawer-path {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11.5px;
    overflow-wrap: anywhere;
  }

  .icon-btn {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 30px; height: 30px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
  }

  .icon-btn:hover { color: var(--ink); border-color: rgba(2,112,194,.35); }

  .drawer-body { flex: 1; overflow: auto; padding: 16px; }

  .preview {
    display: grid;
    place-items: center;
    min-height: 168px;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #f7f9fc;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .preview.dark { background: #0b0b0e; border-color: #1c1c22; color: #fff; }
  .preview img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; }
  .preview .icon-xl svg { width: 72px; height: 72px; }
  .preview .brand-xl svg { width: 120px; height: 120px; }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; width: 100%; }

  .swatch { border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
  .swatch .chip { height: 34px; background-image: linear-gradient(45deg,#e6ebf2 25%,transparent 25%),linear-gradient(-45deg,#e6ebf2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6ebf2 75%),linear-gradient(-45deg,transparent 75%,#e6ebf2 75%); background-size: 10px 10px; background-position: 0 0,0 5px,5px -5px,-5px 0; }
  .swatch .chip i { display: block; height: 100%; }
  .swatch .sw-name { padding: 5px 6px 6px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .meta-rows { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }

  .meta-row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 9px 12px;
    font-size: 12.5px;
    border-bottom: 1px solid var(--line);
  }

  .meta-row:last-child { border-bottom: none; }
  .meta-row dt { color: var(--muted); font-weight: 600; }
  .meta-row dd { margin: 0; font-family: var(--mono); font-size: 12px; text-align: right; overflow-wrap: anywhere; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 36px;
    padding: 0 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
  }

  .btn:hover { border-color: rgba(2,112,194,.4); color: var(--brand); }
  .btn.primary { background: #102033; border-color: #102033; color: #fff; }
  .btn.primary:hover { background: var(--brand); border-color: var(--brand); color: #fff; }

  .code {
    margin: 0;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #0f172a;
    color: #cbd5e1;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    overflow: auto;
    max-height: 340px;
    white-space: pre;
  }

  .code-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 12px);
    padding: 9px 15px;
    border-radius: 8px;
    background: #102033;
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 40;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- list view ---------- */
  .list { padding: 6px 0 8px; }

  .row {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) 96px 108px;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 9px 16px;
    border: none;
    border-bottom: 1px solid #eef2f7;
    background: transparent;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .row:hover { background: #f7f9fc; }
  .row.on { background: var(--brand-soft); }
  .row-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; background: #f2f6fb; color: var(--brand); overflow: hidden; }
  .row-icon svg { width: 17px; height: 17px; }
  .row-icon img { width: 100%; height: 100%; object-fit: cover; }
  .row-name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-kind, .row-size { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .row-size { text-align: right; }
  .list .group-label { padding: 12px 16px 6px; margin: 0; }

  @media (max-width: 860px) {
    .explorer { grid-template-columns: 1fr; }
    .tree { position: static; }
    .row { grid-template-columns: 30px minmax(0, 1fr) 92px; }
    .row-kind { display: none; }
  }

  @media (max-width: 720px) {
    .page { width: min(100% - 24px, 1180px); padding-top: 22px; }
    h1 { font-size: 27px; }
    .files-head { flex-direction: column; }
    .count { text-align: left; }
  }
</style>
</head>
<body>

<div class="page">
  <p class="eyebrow">Design System</p>
  <h1>Assets</h1>
  <p class="summary">
    Todo lo exportable del rediseño de la app, navegable como un filesystem.
    Los archivos se sirven tal cual desde <code>/assets</code>: click en cualquiera para
    previsualizar, copiar la ruta o el código, y descargar.
  </p>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="q" type="search" placeholder="Buscar archivo… (icons, .css, football)" autocomplete="off" spellcheck="false">
    </div>
    <div class="seg" id="view-toggle">
      <button data-view="grid" class="on">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
        Grid
      </button>
      <button data-view="list">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>
        Lista
      </button>
    </div>
  </div>

  <div class="explorer">
    <aside class="tree">
      <div class="tree-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
        assets/
      </div>
      <nav id="tree-nav"></nav>
      <div class="tree-foot" id="tree-foot"></div>
    </aside>

    <section class="files">
      <div class="files-head">
        <div>
          <div class="crumbs" id="crumbs"></div>
          <p class="files-note" id="files-note"></p>
        </div>
        <div class="count" id="files-count"></div>
      </div>
      <div id="files-body"></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">
      <h3 id="d-name"></h3>
      <span class="drawer-path" id="d-path"></span>
    </div>
    <button class="icon-btn" id="d-close" aria-label="Cerrar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
const MANIFEST = {
 "root": "assets",
 "folders": [
  {
   "name": "brand",
   "label": "Marca",
   "note": "Logo mark de la app. El wordmark es tipográfico: “Sport” en #FFFFFF + “Match” en #4EA8FF, Inter Tight 800, tracking -0.035em.",
   "files": [
    {
     "name": "logo-mark.svg",
     "path": "/assets/brand/logo-mark.svg",
     "ext": "svg",
     "size": 434,
     "svg": "<svg width=\"96\" height=\"96\" viewBox=\"0 0 96 96\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"SportMatch\">\n  <rect x=\"2\" y=\"2\" width=\"92\" height=\"92\" rx=\"24\" fill=\"#000000\"><\/rect>\n  <rect x=\"2.5\" y=\"2.5\" width=\"91\" height=\"91\" rx=\"23.5\" stroke=\"#ffffff\" stroke-opacity=\"0.16\"><\/rect>\n  \n  <path d=\"M30 30 L30 66 L54 48 Z\" fill=\"#4ea8ff\"><\/path>\n  <path d=\"M66 30 L66 66 L42 48 Z\" fill=\"#ffffff\"><\/path>\n<\/svg>"
    }
   ]
  },
  {
   "name": "icons",

     "ext": "css",
     "size": 1078,
     "text": "/* ============================================================\n   SportMatch — Base layer\n   Minimal resets + the default dark canvas. Consumers get a\n   true-black, white-ink, Inter-by-default surface for free.\n   ============================================================ */\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  text-size-adjust: 100%;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg-base);\n  color: var(--text-primary);\n  font: var(--text-body);\n  letter-spacing: var(--tracking-normal);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, p, figure {\n  margin: 0;\n}\n\nbutton {\n  font-family: inherit;\n  cursor: pointer;\n}\n\nimg {\n  display: block;\n  max-width: 100%;\n}\n\n/* Tabular, heavy numerals wherever a stat is shown */\n.sm-tabular {\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: 'tnum' 1;\n}\n\n/* Selection picks up the brand accent */\n::selection {\n  background: var(--accent);\n  color: var(--accent-ink);\n}\n",

     "text": "/* ============================================================\n   SportMatch — Color System\n   Dark-first. Pure black canvas, white ink, frosted glass\n   surfaces, one electric-blue accent. Color is rationed:\n   photography carries the energy, UI stays monochrome + glass.\n   ============================================================ */\n\n:root {\n  /* ---- Base ---- */\n  --color-black: #000000;\n  --color-white: #ffffff;\n\n  /* ---- Canvas / backdrops ---- */\n  --bg-base: #000000;        /* the app canvas — always true black   */\n  --bg-raised: #0b0b0e;      /* sheets / modals over a dimmed canvas  */\n  --bg-sunken: #060608;      /* map shells, media wells               */\n  --scrim: rgba(0, 0, 0, 0.55);   /* dim behind sheets & modals       */\n\n  /* ---- Ink (white text & icons over dark) ---- */\n  --ink-100: rgba(255, 255, 255, 1);\n  --ink-80:  rgba(255, 255, 255, 0.80);\n  --ink-64:  rgba(255, 255, 255, 0.64);\n  --ink-46:  rgba(255, 255, 255, 0.46);\n  --ink-32:  rgba(255, 255, 255, 0.32);\n  --ink-16:  rgba(255, 255, 255, 0.16);\n\n  /* ---- Glass surfaces (frosted, sit on photography) ---- */\n  --glass-thin:    rgba(255, 255, 255, 0.03);\n  --glass:         rgba(255, 255, 255, 0.05);\n  --glass-strong:  rgba(255, 255, 255, 0.10);\n  --glass-solid:   rgba(22, 22, 26, 0.60);   /* sheets where legibility wins */\n  --glass-border:        rgba(255, 255, 255, 0.15);\n  --glass-border-strong: rgba(255, 255, 255, 0.26);\n  --glass-highlight:     rgba(255, 255, 255, 0.40); /* top hairline sheen */\n\n  /* ---- Accent — Electric Blue ---- */\n  --accent:        #4ea8ff;\n  --accent-bright: #7cc0ff;\n  --accent-deep:   #2c84e0;\n  --accent-ink:    #001226;               /* text on a solid accent fill */\n  --accent-tint:   rgba(78, 168, 255, 0.16);\n  --accent-glow:   rgba(78, 168, 255, 0.45);\n\n  /* ---- Semantic ---- */\n  --success:  #66d575;\n  --success-tint: rgba(102, 213, 117, 0.16);\n  --warning:  #ffcb57;\n  --danger:   #ff5a5f;\n  --danger-tint: rgba(255, 90, 95, 0.16);\n\n  /* ---- Swipe affordances ---- */\n  --swipe-yes:  #66d575;   /* interested → right */\n  --swipe-no:   #ff5a6a;   /* skip → left        */\n  --swipe-info: #4ea8ff;   /* details → up/tap   */\n\n  /* ============================================================\n     Semantic aliases — reference these in components\n     ============================================================ */\n  --text-primary:   var(--ink-100);\n  --text-secondary: var(--ink-64);\n  --text-tertiary:  var(--ink-46);\n  --text-disabled:  var(--ink-32);\n  --text-on-accent: var(--color-white);\n\n  --surface-glass:        var(--glass);\n  --surface-glass-strong: var(--glass-strong);\n  --surface-sheet:        var(--glass-solid);\n  --border-hairline:      var(--glass-border);\n  --border-emphasis:      var(--glass-border-strong);\n\n  --focus-ring: var(--accent);\n}\n",

     "text": "/* ============================================================\n   SportMatch — Effects\n   Radii, blur, shadows. Everything is soft and floating:\n   big corner radii, frosted blur, deep ambient shadows.\n   ============================================================ */\n\n:root {\n  /* ---- Corner radii ---- */\n  --radius-xs:   0.5rem;   /*  8 — chips, tags          */\n  --radius-sm:   0.75rem;  /* 12 — inputs, small cards  */\n  --radius-md:   1.25rem;  /* 20 — glass cards          */\n  --radius-lg:   1.75rem;  /* 28 — large media cards    */\n  --radius-xl:   2.25rem;  /* 36 — sheets, hero panels  */\n  --radius-2xl:  2.75rem;  /* 44 — bottom sheets        */\n  --radius-pill: 999px;    /* buttons, nav, avatars     */\n\n  /* ---- Backdrop blur (frosted glass) ---- */\n  --blur-sm: 12px;   /* light chips                     */\n  --blur-md: 24px;   /* glass cards & nav               */\n  --blur-lg: 40px;   /* full sheets & modals            */\n\n  /* ---- Shadows ---- */\n  /* Floating controls — crisp, close ambient pool */\n  --shadow-float: 0 6px 20px rgba(0, 0, 0, 0.45);\n  /* Glass cards — wide soft lift off the canvas */\n  --shadow-card: 0 18px 50px rgba(0, 0, 0, 0.50);\n  /* Sheets & modals — deep theatrical lift */\n  --shadow-sheet: 0 -12px 60px rgba(0, 0, 0, 0.60);\n  /* Accent glow — primary CTA & active swipe-yes */\n  --shadow-glow: 0 3px 12px var(--accent-glow);\n\n  /* ---- Inset hairline (the frosted \"edge of glass\" sheen) ---- */\n  --inset-top-sheen: inset 0 1px 0 var(--glass-highlight);\n  --ring-glass: inset 0 0 0 1px var(--glass-border);\n\n  /* ---- Motion ---- */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */ /* iOS overshoot */\n  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);     /* @kind other */ /* decel, settled */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);    /* @kind other */\n  --dur-fast:   140ms; /* @kind other */\n  --dur-base:   240ms; /* @kind other */\n  --dur-slow:   420ms; /* @kind other */\n\n  /* Press feedback */\n  --press-scale: 0.96; /* @kind other */\n}\n",

     "text": "/* ============================================================\n   SportMatch — Spacing & Layout\n   4px base grid. Mobile canvas is 390px wide; gutters are 20px.\n   Generous air — fewer things, more breathing room.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-1:  0.25rem;  /*  4 */\n  --space-2:  0.5rem;   /*  8 */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.25rem;  /* 20 — default screen gutter */\n  --space-6:  1.5rem;   /* 24 */\n  --space-7:  2rem;     /* 32 */\n  --space-8:  2.5rem;   /* 40 */\n  --space-9:  3rem;     /* 48 */\n  --space-10: 4rem;     /* 64 */\n\n  /* ---- Layout ---- */\n  --screen-width: 390px;       /* iPhone canvas                     */\n  --screen-gutter: var(--space-5);  /* 20px side padding            */\n  --safe-top: 59px;            /* status bar + notch area           */\n  --safe-bottom: 34px;         /* home-indicator inset              */\n  --nav-height: 64px;          /* floating bottom nav pill          */\n  --content-max: 1080px;       /* desktop/tablet adaptation cap     */\n}\n",

     "text": "/* ============================================================\n   SportMatch — Typography\n   Inter Tight for display (big, tight, confident), Inter for\n   text & UI. Numbers are heroes: tabular, heavy, oversized.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Inter Tight', -apple-system, 'SF Pro Display', system-ui, sans-serif;\n  --font-text:    'Inter', -apple-system, 'SF Pro Text', system-ui, sans-serif;\n  --font-numeric: 'Inter Tight', -apple-system, 'SF Pro Display', system-ui, sans-serif;\n\n  /* ---- Weights ---- */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n  --weight-heavy:    800;\n\n  /* ---- Type scale (sizes) ---- */\n  --size-hero:     3.5rem;   /* 56 — \"Find your next match.\"        */\n  --size-display:  2.75rem;  /* 44 — match names, big screen titles */\n  --size-title:    1.75rem;  /* 28 — screen titles                  */\n  --size-headline: 1.375rem; /* 22 — card headlines                 */\n  --size-body:     1.0625rem;/* 17 — body copy                      */\n  --size-callout:  0.9375rem;/* 15 — supporting text                */\n  --size-caption:  0.8125rem;/* 13 — metadata, labels               */\n  --size-micro:    0.6875rem;/* 11 — overline / tags                */\n\n  /* ---- Big numbers ---- */\n  --size-stat-xl:  4rem;     /* 64 — rating hero on profile         */\n  --size-stat:     2.75rem;  /* 44 — stat blocks                    */\n\n  /* ---- Line heights ---- */\n  --leading-tight:   1.04;   /* hero / display                      */\n  --leading-snug:    1.16;   /* titles & headlines                  */\n  --leading-normal:  1.45;   /* body                                */\n\n  /* ---- Letter spacing ---- */\n  --tracking-hero:    -0.03em;\n  --tracking-title:   -0.02em;\n  --tracking-normal:  -0.01em;\n  --tracking-overline: 0.14em;   /* uppercase micro labels          */\n\n  /* ============================================================\n     Composite text roles — `font: var(--text-hero)` shorthands\n     ============================================================ */\n  --text-hero:     var(--weight-heavy) var(--size-hero)/var(--leading-tight) var(--font-display);\n  --text-display:  var(--weight-bold) var(--size-display)/var(--leading-tight) var(--font-display);\n  --text-title:    var(--weight-bold) var(--size-title)/var(--leading-snug) var(--font-display);\n  --text-headline: var(--weight-semibold) var(--size-headline)/var(--leading-snug) var(--font-display);\n  --text-body:     var(--weight-regular) var(--size-body)/var(--leading-normal) var(--font-text);\n  --text-callout:  var(--weight-medium) var(--size-callout)/var(--leading-normal) var(--font-text);\n  --text-caption:  var(--weight-medium) var(--size-caption)/var(--leading-snug) var(--font-text);\n  --text-stat:     var(--weight-heavy) var(--size-stat)/1 var(--font-numeric);\n}\n",
