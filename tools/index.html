<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportMatch</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/logo-mark.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100vh; width: 100vw; overflow: hidden; display: flex; background: #0f172a; }

  #frame-wrapper { flex: 1; position: relative; overflow: hidden; }
  #main-frame { width: 100%; height: 100%; border: none; display: block; background: #f8fafc; }

  #sidebar {
    width: 180px;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    transition: width 0.25s cubic-bezier(.4,0,.2,1);
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  #sidebar.collapsed { width: 48px; }

  .sb-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }
  .sb-logo {
    width: 26px; height: 26px;
    border-radius: 7px;
    flex-shrink: 0;
    display: block;
  }
  .sb-title {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 12.5px; font-weight: 700;
    color: #e2e8f0;
    white-space: nowrap;
    transition: opacity 0.2s, transform 0.2s;
    line-height: 1.2;
  }
  .sb-sub {
    font-size: 10px; font-weight: 400; color: #64748b;
    display: block; margin-top: 1px;
  }
  #sidebar.collapsed .sb-title { opacity: 0; transform: translateX(6px); pointer-events: none; }

  .sb-nav {
    flex: 1;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 8px;
    border: none; background: transparent;
    color: #64748b;
    border-radius: 8px; cursor: pointer;
    transition: background 0.14s, color 0.14s;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px; font-weight: 500;
    text-align: left; white-space: nowrap;
    position: relative;
    text-decoration: none;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.06); color: #cbd5e1; }
  .nav-btn.active { background: rgba(34,197,94,0.14); color: #22c55e; }
  .nav-btn.active .nav-icon { opacity: 1; }

  .nav-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.6; transition: opacity 0.14s; }
  .nav-btn:hover .nav-icon, .nav-btn.active .nav-icon { opacity: 1; }

  .nav-label { transition: opacity 0.2s, transform 0.2s; }
  #sidebar.collapsed .nav-label { opacity: 0; transform: translateX(6px); pointer-events: none; }

  #sidebar.collapsed .nav-btn::after {
    content: attr(data-label);
    position: absolute;
    left: calc(100% + 10px);
    top: 50%; transform: translateY(-50%);
    background: #1e293b;
    color: #e2e8f0;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #sidebar.collapsed .nav-btn:hover::after { opacity: 1; }

  .sb-footer {
    padding: 8px 6px;
    border-top: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #toggle-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 34px;
    border: none; border-radius: 7px;
    background: rgba(255,255,255,0.04);
    color: #475569; cursor: pointer;
    transition: background 0.14s, color 0.14s;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  #toggle-btn:hover { background: rgba(255,255,255,0.09); color: #94a3b8; }
  .toggle-chevron { flex-shrink: 0; transition: transform 0.25s cubic-bezier(.4,0,.2,1); }
  .toggle-label { transition: opacity 0.2s; }
  #sidebar.collapsed .toggle-chevron { transform: rotate(180deg); }
  #sidebar.collapsed .toggle-label { opacity: 0; width: 0; overflow: hidden; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-header">
    <img class="sb-logo" src="/assets/brand/logo-mark.svg" alt="SportMatch" width="26" height="26">
    <span class="sb-title">
      SportMatch
      <span class="sb-sub">Dev Branch</span>
    </span>
  </div>

  <nav class="sb-nav">
    <button class="nav-btn active" data-src="/tools/pages/home.html" data-label="Inicio">
      <!-- home icon -->
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8.4 10 3l7 5.4V16a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 16V8.4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8 17.5v-5h4v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">Inicio</span>
    </button>

    <button class="nav-btn" data-src="/tools/pages/wireframes.html" data-label="Wireframes">
      <!-- mobile phone icon -->
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="1.5" width="10" height="17" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
        <line x1="8.5" y1="3.5" x2="11.5" y2="3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="10" cy="16" r="0.9" fill="currentColor"/>
      </svg>
      <span class="nav-label">Wireframes</span>
    </button>

    <button class="nav-btn" data-src="/tools/pages/devtools.html" data-label="Dev Tools">
      <!-- toolbox icon -->
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2.5" y="6.5" width="15" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7.25 6.5V4.6c0-.9.7-1.6 1.6-1.6h2.3c.9 0 1.6.7 1.6 1.6v1.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M2.8 10.2h14.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8.2 10.2v1.3c0 .4.3.7.7.7h2.2c.4 0 .7-.3.7-.7v-1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">Dev Tools</span>
    </button>

    <button class="nav-btn" data-src="/tools/pages/ai.html" data-label="AI">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2.5l1.2 3.7a1.9 1.9 0 0 0 1.2 1.2l3.6 1.1-3.6 1.2a1.9 1.9 0 0 0-1.2 1.2L10 14.5l-1.2-3.6a1.9 1.9 0 0 0-1.2-1.2L4 8.5l3.6-1.1a1.9 1.9 0 0 0 1.2-1.2L10 2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M15.5 13l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5.5-1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">AI</span>
    </button>

    <button class="nav-btn" data-src="/tools/pages/assets.html" data-label="Assets">
      <!-- folder / assets icon -->
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.75 5.25c0-.83.67-1.5 1.5-1.5h2.9c.5 0 .97.25 1.25.67l.6.9c.28.42.75.68 1.25.68h4c.83 0 1.5.67 1.5 1.5v7.25c0 .83-.67 1.5-1.5 1.5H4.25c-.83 0-1.5-.67-1.5-1.5V5.25Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M6.5 12.5l2-2.2 1.7 1.9 1.4-1.5 1.9 2.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label">Assets</span>
    </button>

    <button class="nav-btn" data-src="/tools/pages/criteria.html" data-label="Criteria">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5.5 3.5h9A1.5 1.5 0 0 1 16 5v10a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 4 15V5a1.5 1.5 0 0 1 1.5-1.5Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7 7h6M7 10h6M7 13h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">Criteria</span>
    </button>
  </nav>

  <div class="sb-footer">
    <button id="toggle-btn">
      <!-- chevron right -->
      <svg class="toggle-chevron" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M9 3L5 7L9 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="toggle-label">Colapsar</span>
    </button>
  </div>
</div>

<div id="frame-wrapper">
  <iframe id="main-frame" src="/tools/pages/home.html" title="Vista actual"></iframe>
</div>

<script>
  const sidebar = document.getElementById('sidebar');
  const frame = document.getElementById('main-frame');
  const toggleLabel = sidebar.querySelector('.toggle-label');

  // Below this width the 180px sidebar would eat half the screen, so the rail
  // starts collapsed — until the reader says otherwise.
  const NARROW = 720;
  let toggledByUser = false;

  function setCollapsed(collapsed) {
    sidebar.classList.toggle('collapsed', collapsed);
    toggleLabel.textContent = collapsed ? 'Expandir' : 'Colapsar';
  }

  setCollapsed(window.innerWidth < NARROW);

  document.getElementById('toggle-btn').addEventListener('click', () => {
    toggledByUser = true;
    setCollapsed(!sidebar.classList.contains('collapsed'));
  });

  window.addEventListener('resize', () => {
    if (!toggledByUser) setCollapsed(window.innerWidth < NARROW);
  });

  function showView(src) {
    const target = document.querySelector(`button.nav-btn[data-src="${src}"]`);
    if (!target) return;
    document.querySelectorAll('button.nav-btn').forEach(b => b.classList.remove('active'));
    target.classList.add('active');
    frame.src = src;
  }

  document.querySelectorAll('button.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => showView(btn.dataset.src));
  });

  // Shortcut chips inside the Inicio page ask the shell to switch view.
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow) return;
    if (event.data && event.data.type === 'sm-navigate') showView(event.data.src);
  });
</script>

</body>
</html>
