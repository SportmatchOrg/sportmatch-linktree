  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="overrides.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    /* Responsive stage: full-bleed native app on phones, framed device on desktop. */
    .sm-stage {
      position: fixed; inset: 0; overflow: auto;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 0%, #14181f 0%, #05060a 60%, #000 100%);
    }
    .sm-device {
      position: relative; flex: none;
      width: 100%; height: 100vh; height: 100dvh;
      background: #000; overflow: hidden;
    }
    /* Tablet / desktop — present as a real device on the dark backdrop. */
    @media (min-width: 760px) {
      .sm-stage { padding: 16px; overflow: hidden; }
      .sm-device {
        width: 390px;
        height: 844px;
        border-radius: 54px;
        box-shadow: 0 0 0 11px #15171c, 0 0 0 13px #2a2d34, 0 50px 120px rgba(0,0,0,0.7);
        transform: scale(var(--sm-device-scale, 1));
        transform-origin: center;
      }
    }
    /* Leaflet panes must sit under the glass chrome. */
    .sm-device .leaflet-container { background: #0a0d12; font-family: var(--font-text); }
  </style>
</helmet>
<div class="sm-stage">
  <div class="sm-device">
    <x-import component="SportMatchApp" from="./SportMatchApp.jsx" hint-size="100%,100%" style="position:absolute; inset:0; width:100%; height:100%"></x-import>
  </div>
</div>
<script>
  (function () {
    var device = document.querySelector('.sm-device');
    var desktop = window.matchMedia('(min-width: 760px)');

    function fitDevice() {
      if (!device) return;
      if (!desktop.matches) {
        device.style.setProperty('--sm-device-scale', '1');
        return;
      }

      var frameWidth = 416;
      var frameHeight = 870;
      var breathingRoom = 24;
      var availableWidth = Math.max(0, window.innerWidth - breathingRoom);
      var availableHeight = Math.max(0, window.innerHeight - breathingRoom);
      var scale = Math.min(1, availableWidth / frameWidth, availableHeight / frameHeight);
      device.style.setProperty('--sm-device-scale', scale.toFixed(3));
    }

    window.addEventListener('resize', fitDevice);
    window.addEventListener('load', fitDevice);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitDevice);
    if (desktop.addEventListener) desktop.addEventListener('change', fitDevice);
    fitDevice();
  })();
</script>
</x-dc>
